                              .filter(Boolean)
                              .join(" · ")}
                          </div>
                        )}
                      </div>

                      <div className="lg:col-span-6 space-y-3">
                        {act.title && (
                          <h3 className="text-xl font-medium tracking-tight">
                            {act.title}
                          </h3>
                        )}
                        {act.role && (
                          <div
                            className={`text-sm font-medium ${
                              isDark ? "text-zinc-300" : "text-zinc-800"
                            }`}
                          >
                            บทบาทหน้าที่ {act.role}
                          </div>
                        )}
                        {act.summary && (
                          <p
                            className={`text-sm leading-relaxed ${
                              isDark ? "text-zinc-400" : "text-zinc-600"
                            }`}
                          >
                            {act.summary}
                          </p>
                        )}
                        {act.lessonsLearned && (
                          <div
                            className={`pt-3 border-t text-sm leading-relaxed ${
                              isDark
                                ? "border-white/10 text-zinc-300"
                                : "border-zinc-200 text-zinc-700"
                            }`}
                          >
                            <span className="font-medium">สิ่งที่ได้เรียนรู้ </span>
                            <span>{act.lessonsLearned}</span>
                          </div>
                        )}
                      </div>

                      <div className="lg:col-span-3 flex flex-col gap-3">
                        {act.galleryImages && act.galleryImages[0] && (
                          <img
                            src={act.galleryImages[0]}
                            alt={act.title}
                            loading="lazy"
                            referrerPolicy="no-referrer"
                            className="w-full aspect-[16/10] object-cover rounded-xl border border-current/10"
                          />
                        )}
                        {isAdmin && !act.isLocalSeed && (
                          <div className="flex items-center justify-end gap-2">
                            <button
                              type="button"
                              onClick={() => {
                                playSound("open");
                                setEditingActivity(act);
                                setFormOpen(true);
                              }}
                              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                                isDark
                                  ? "border-white/15 bg-white/5 hover:bg-white/10"
                                  : "border-zinc-200 bg-zinc-50 hover:bg-zinc-100"
                              }`}
                            >
                              <IconPencil size={12} />
                              <span>แก้ไข</span>
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                playSound("delete");
                                onDeleteActivity(act);
                              }}
                              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-rose-500/30 text-rose-500 text-xs font-medium hover:bg-rose-500/15"
                            >
                              <IconTrash size={12} />
                              <span>ลบ</span>
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {filtered.map((act) => (
                  <div
                    key={act.id}
                    className={`rounded-2xl border overflow-hidden flex flex-col ${
                      isDark
                        ? "border-white/10 bg-zinc-950"
                        : "border-zinc-200 bg-white shadow-sm"
                    }`}
                  >
                    {act.galleryImages && act.galleryImages[0] && (
                      <img
                        src={act.galleryImages[0]}
                        alt={act.title}
                        loading="lazy"
                        referrerPolicy="no-referrer"
                        className="w-full aspect-[16/9] object-cover"
                      />
                    )}
                    <div className="p-6 flex flex-col flex-grow">
                      {(act.category || act.eventDate || act.location) && (
                        <div
                          className={`text-xs mb-2 flex flex-wrap items-center gap-1.5 ${
                            isDark ? "text-zinc-400" : "text-zinc-500"
                          }`}
                        >
                          {[
                            act.category,
                            act.eventDate ? formatFormalThaiDate(act.eventDate) : "",
                            act.location,
                          ]
                            .filter(Boolean)
                            .map((part, idx, arr) => (
                              <React.Fragment key={idx}>
                                <span>{part}</span>
                                {idx < arr.length - 1 && <span aria-hidden="true">·</span>}
                              </React.Fragment>
                            ))}
                        </div>
                      )}
                      {act.title && (
                        <h3 className="text-lg font-medium mb-2">{act.title}</h3>
                      )}
                      {act.role && (
                        <div
                          className={`text-xs font-medium mb-3 ${
                            isDark ? "text-zinc-300" : "text-zinc-700"
                          }`}
                        >
                          บทบาทหน้าที่ {act.role}
                        </div>
                      )}
                      {act.summary && (
                        <p
                          className={`text-sm leading-relaxed mb-4 flex-grow ${
                            isDark ? "text-zinc-400" : "text-zinc-600"
                          }`}
                        >
                          {act.summary}
                        </p>
                      )}
                      {act.lessonsLearned && (
                        <div
                          className={`pt-3 border-t text-xs leading-relaxed ${
                            isDark
                              ? "border-white/10 text-zinc-400"
                              : "border-zinc-200 text-zinc-600"
                          }`}
                        >
                          สิ่งที่ได้เรียนรู้ {act.lessonsLearned}
                        </div>
                      )}
                      {isAdmin && !act.isLocalSeed && (
                        <div className="flex items-center justify-end gap-2 mt-4 pt-3 border-t border-current/10">
                          <button
                            type="button"
                            onClick={() => {
                              playSound("open");
                              setEditingActivity(act);
                              setFormOpen(true);
                            }}
                            className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                              isDark
                                ? "border-white/15 bg-white/5 hover:bg-white/10"
                                : "border-zinc-200 bg-zinc-50 hover:bg-zinc-100"
                            }`}
                          >
                            <IconPencil size={12} />
                            <span>แก้ไข</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              playSound("delete");
                              onDeleteActivity(act);
                            }}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-rose-500/30 text-rose-500 text-xs font-medium hover:bg-rose-500/15"
                          >
                            <IconTrash size={12} />
                            <span>ลบ</span>
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {formOpen && (
            <ActivityFormModal
              isDark={isDark}
              editingActivity={editingActivity}
              onClose={() => {
                playSound("click");
                setFormOpen(false);
                setEditingActivity(null);
              }}
              onSave={async (payload, editId) => {
                const ok = await onSaveActivity(payload, editId);
                if (ok) {
                  setFormOpen(false);
                  setEditingActivity(null);
                }
                return ok;
              }}
              onError={onError}
            />
          )}
        </section>
      );
    }

    function ActivityFormModal({ isDark, editingActivity, onClose, onSave, onError }) {
      const fileRef = useRef(null);
      const [title, setTitle] = useState(editingActivity?.title || "");
      const [eventDate, setEventDate] = useState(editingActivity?.eventDate || "");
      const [category, setCategory] = useState(editingActivity?.category || "");
      const [location, setLocation] = useState(editingActivity?.location || "");
      const [role, setRole] = useState(editingActivity?.role || "");
      const [summary, setSummary] = useState(editingActivity?.summary || "");
      const [lessonsLearned, setLessonsLearned] = useState(
        editingActivity?.lessonsLearned || ""
      );
      const [imageUrl, setImageUrl] = useState(
        editingActivity?.galleryImages?.[0] || ""
      );
      const [isFeatured, setIsFeatured] = useState(
        Boolean(editingActivity?.isFeatured)
      );
      const [saving, setSaving] = useState(false);

      const handleUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 720);
          playSound("success");
          setImageUrl(dataUrl);
        } catch (err) {
          onError(err?.message || "ไม่สามารถอัปโหลดรูปภาพได้");
        } finally {
          e.target.value = "";
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (
          !title.trim() &&
          !summary.trim() &&
          !imageUrl.trim() &&
          !role.trim() &&
          !location.trim() &&
          !lessonsLearned.trim()
        ) {
          onError("กรุณากรอกข้อมูลกิจกรรมหรืออัปโหลดรูปภาพอย่างน้อย 1 รายการ");
          return;
        }
        setSaving(true);
        try {
          const ok = await onSave(
            {
              title: title.trim(),
              eventDate,
              buddhistYear: eventDate ? extractBuddhistYear(eventDate) : "",
              category: category.trim(),
              location: location.trim(),
              role: role.trim(),
              summary: summary.trim(),
              lessonsLearned: lessonsLearned.trim(),
              galleryImages: imageUrl.trim() ? [imageUrl.trim()] : [],
              isFeatured,
            },
            editingActivity?.id
          );
          if (ok) {
            playSound("success");
          }
        } finally {
          setSaving(false);
        }
      };

      const inputClass = `w-full rounded-xl border px-3.5 py-2 text-sm focus:outline-none ${
        isDark
          ? "border-white/15 bg-black text-white focus:border-white/50"
          : "border-zinc-300 bg-zinc-50 text-zinc-950 focus:border-zinc-900"
      }`;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto">
          <div
            className={`animate-modal w-full max-w-2xl rounded-2xl border p-6 sm:p-7 shadow-2xl my-8 max-h-[90vh] overflow-y-auto ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            <div className="flex items-center justify-between pb-3 mb-4 border-b border-current/10">
              <h3 className="text-lg font-semibold">
                {editingActivity ? "แก้ไขข้อมูลกิจกรรม" : "บันทึกกิจกรรมใหม่"}
              </h3>
              <button
                type="button"
                onClick={onClose}
                aria-label="ปิดหน้าต่างกิจกรรม"
                className="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-current/10"
              >
                <IconX size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-medium mb-1">ชื่อกิจกรรมหรือเหตุการณ์</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="ระบุชื่อกิจกรรม"
                  className={inputClass}
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">วันที่จัดกิจกรรม</label>
                  <input
                    type="date"
                    value={eventDate}
                    onChange={(e) => setEventDate(e.target.value)}
                    className={`${inputClass} min-w-0 max-w-full appearance-none`}
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">ประเภทกิจกรรม</label>
                  <input
                    type="text"
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    placeholder="งานอาสา ค่ายวิชาการ โครงการพัฒนา"
                    className={`${inputClass} min-w-0 max-w-full`}
                  />
                </div>
              </div>

              <div className="min-w-0">
                <label className="block text-xs font-medium mb-1">สถานที่</label>
                <input
                  type="text"
                  value={location}
                  onChange={(e) => setLocation(e.target.value)}
                  placeholder="ระบุสถานที่จัดกิจกรรม"
                  className={`${inputClass} min-w-0 max-w-full`}
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">บทบาทหน้าที่</label>
                <input
                  type="text"
                  value={role}
                  onChange={(e) => setRole(e.target.value)}
                  placeholder="ระบุบทบาทความรับผิดชอบ"
                  className={inputClass}
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">สรุปรายละเอียดกิจกรรม</label>
                <textarea
                  rows={3}
                  value={summary}
                  onChange={(e) => setSummary(e.target.value)}
                  placeholder="อธิบายภาพรวมและผลการดำเนินงาน"
                  className={inputClass}
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">สิ่งที่ได้เรียนรู้</label>
                <textarea
                  rows={2}
                  value={lessonsLearned}
                  onChange={(e) => setLessonsLearned(e.target.value)}
                  placeholder="สรุปบทเรียนหรือทักษะที่ได้รับ"
                  className={inputClass}
                />
              </div>

              <div
                className={`rounded-xl border p-3.5 ${
                  isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-zinc-50"
                }`}
              >
                <label className="block text-xs font-medium mb-2">
                  ภาพบรรยากาศกิจกรรม บีบอัดอัตโนมัติ
                </label>
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*"
                  onChange={handleUpload}
                  className="hidden"
                />
                {imageUrl && (
                  <img
                    src={imageUrl}
                    alt="ตัวอย่างภาพบรรยากาศกิจกรรม"
                    className="w-full max-h-48 object-cover rounded-lg border border-current/15 mb-3"
                  />
                )}
                <div className="flex items-center gap-2 mb-2">
                  <button
                    type="button"
                    onClick={() => {
                      playSound("click");
                      fileRef.current?.click();
                    }}
                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                      isDark
                        ? "border-white/20 bg-white/10 text-white"
                        : "border-zinc-300 bg-white text-zinc-900"
                    }`}
                  >
                    <IconUpload size={13} />
                    <span>อัปโหลดรูปภาพ</span>
                  </button>
                  {imageUrl && (
                    <button
                      type="button"
                      onClick={() => setImageUrl("")}
                      className="text-xs text-rose-500 hover:underline"
                    >
                      ลบรูปภาพ
                    </button>
                  )}
                </div>
                <input
                  type="text"
                  value={imageUrl}
                  onChange={(e) => setImageUrl(e.target.value)}
                  placeholder="หรือวางลิงก์รูปภาพบรรยากาศ"
                  className={inputClass}
                />
              </div>

              <label className="inline-flex items-center gap-2 text-sm cursor-pointer">
                <input
                  type="checkbox"
                  checked={isFeatured}
                  onChange={(e) => setIsFeatured(e.target.checked)}
                  className="rounded"
                />
                <span>แสดงเป็นกิจกรรมเด่น</span>
              </label>

              <div className="flex items-center justify-end gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl text-sm font-medium border ${
                    isDark
                      ? "border-white/15 text-zinc-300 hover:bg-white/10"
                      : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                  }`}
                >
                  ยกเลิก
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className={`px-5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  {saving ? "กำลังบันทึก..." : "บันทึกกิจกรรม"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== SECTION 4: GALLERY / MOMENTS ====================
    function GallerySection({
      isDark,
      moments,
      isAdmin,
      onAddMoment,
      onDeleteMoment,
      onError,
    }) {
      const [activeIndex, setActiveIndex] = useState(null);
      const [addModalOpen, setAddModalOpen] = useState(false);

      useEffect(() => {
        if (activeIndex === null) return;
        const handleKey = (e) => {
          if (e.key === "Escape") {
            setActiveIndex(null);
          } else if (e.key === "ArrowRight") {
            playSound("click");
            setActiveIndex((idx) =>
              idx === null ? null : (idx + 1) % moments.length
            );
          } else if (e.key === "ArrowLeft") {
            playSound("click");
            setActiveIndex((idx) =>
              idx === null ? null : (idx - 1 + moments.length) % moments.length
            );
          }
        };
        window.addEventListener("keydown", handleKey);
        return () => window.removeEventListener("keydown", handleKey);
      }, [activeIndex, moments.length]);

      const activeMoment =
        activeIndex !== null && moments[activeIndex] ? moments[activeIndex] : null;

      return (
        <section
          id="gallery-section"
          className={`border-t transition-colors duration-300 ${
            isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-white"
          }`}
        >
          <div className="max-w-7xl mx-auto px-6 py-20 md:px-12 lg:px-16">
            <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-10">
              <div>
                <div
                  className={`text-xs uppercase tracking-widest mb-2 ${
                    isDark ? "text-zinc-400" : "text-zinc-500"
                  }`}
                >
                  04 / อัลบั้มภาพความทรงจำ
                </div>
                <h2 className="text-2xl sm:text-4xl font-medium tracking-tight">
                  คลังภาพถ่ายและบรรยากาศกิจกรรม
                </h2>
                <p
                  className={`text-sm sm:text-base mt-2 max-w-2xl leading-relaxed ${
                    isDark ? "text-zinc-400" : "text-zinc-600"
                  }`}
                >
                  เลือกชมภาพความทรงจำจากเหตุการณ์ต่างๆ ในรูปแบบตาราง และคลิกเพื่อเปิดดูภาพขนาดใหญ่พร้อมคำบรรยายประกอบ
                </p>
              </div>

              {isAdmin && (
                <button
                  type="button"
                  onClick={() => {
                    playSound("open");
                    setAddModalOpen(true);
                  }}
                  className={`inline-flex items-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium self-start sm:self-auto whitespace-nowrap ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  <IconPlus size={16} />
                  <span>เพิ่มภาพความทรงจำ</span>
                </button>
              )}
            </div>

            {moments.length === 0 ? (
              <div
                className={`rounded-2xl border p-12 text-center ${
                  isDark
                    ? "border-white/10 bg-zinc-950/60 text-zinc-400"
                    : "border-zinc-200 bg-zinc-50 text-zinc-500"
                }`}
              >
                ยังไม่มีภาพความทรงจำที่บันทึกไว้ กดปุ่มเพิ่มภาพความทรงจำด้านบนเพื่อเพิ่มภาพถ่าย
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                {moments.map((item, idx) => (
                  <div
                    key={item.id}
                    className={`rounded-2xl border overflow-hidden flex flex-col group ${
                      isDark
                        ? "border-white/10 bg-zinc-950 hover:border-white/30"
                        : "border-zinc-200 bg-white hover:border-zinc-400 shadow-sm"
                    }`}
                  >
                    {item.imageUrl && (
                      <button
                        type="button"
                        onClick={() => {
                          playSound("open");
                          setActiveIndex(idx);
                        }}
                        aria-label={`เปิดภาพขนาดใหญ่ ${item.eventTitle || item.caption || "ภาพความทรงจำ"}`}
                        className="block w-full aspect-[4/3] overflow-hidden bg-zinc-900 text-left"
                      >
                        <img
                          src={item.imageUrl}
                          alt={item.caption || item.eventTitle || "ภาพความทรงจำ"}
                          loading="lazy"
                          referrerPolicy="no-referrer"
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                        />
                      </button>
                    )}

                    <div className="p-4 flex flex-col flex-grow justify-between gap-3">
                      <div>
                        {(item.category || item.eventDate) && (
                          <div
                            className={`text-xs mb-1 ${
                              isDark ? "text-zinc-400" : "text-zinc-500"
                            }`}
                          >
                            {[
                              item.category,
                              item.eventDate ? formatFormalThaiDate(item.eventDate) : "",
                            ]
                              .filter(Boolean)
                              .join(" · ")}
                          </div>
                        )}
                        {(item.caption || item.eventTitle) && (
                          <p className="text-sm font-medium leading-snug line-clamp-3">
                            {item.caption || item.eventTitle}
                          </p>
                        )}
                      </div>

                      {isAdmin && !item.isLocalSeed && (
                        <div className="flex justify-end">
                          <button
                            type="button"
                            onClick={() => {
                              playSound("delete");
                              onDeleteMoment(item);
                            }}
                            aria-label={`ลบภาพ ${item.caption || item.eventTitle || "รายการนี้"}`}
                            className="inline-flex items-center gap-1 text-xs text-rose-500 hover:underline"
                          >

    function GalleryFormModal({ isDark, onClose, onSave, onError }) {
      const fileRef = useRef(null);
      const [imageUrl, setImageUrl] = useState("");
      const [caption, setCaption] = useState("");
      const [eventTitle, setEventTitle] = useState("");
      const [eventDate, setEventDate] = useState("");
      const [location, setLocation] = useState("");
      const [category, setCategory] = useState("");
      const [saving, setSaving] = useState(false);

      const handleUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 720);
          playSound("success");
          setImageUrl(dataUrl);
        } catch (err) {
          onError(err?.message || "ไม่สามารถอัปโหลดรูปภาพได้");
        } finally {
          e.target.value = "";
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!imageUrl.trim() && !caption.trim() && !eventTitle.trim()) {
          onError("กรุณาอัปโหลดรูปภาพหรือกรอกข้อความอย่างน้อย 1 รายการ");
          return;
        }
        setSaving(true);
        try {
          const ok = await onSave({
            imageUrl: imageUrl.trim(),
            caption: caption.trim(),
            eventTitle: eventTitle.trim() || caption.trim(),
            eventDate,
            location: location.trim(),
            category: category.trim(),
          });
          if (ok) {
            playSound("success");
          }
        } finally {
          setSaving(false);
        }
      };

        isDark
          ? "border-white/15 bg-black text-white focus:border-white/50"

              <div className="flex items-center justify-end gap-2.5 pt-2">
                <button

                  className={`px-4 py-2 rounded-xl text-sm font-medium border ${

    function AdminLoginModal({ isDark, onClose, onSuccess }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!window.__FB__) return;
        setLoading(true);
        setErrorMsg("");
        try {
          const { auth, signInWithEmailAndPassword } = window.__FB__;
          await signInWithEmailAndPassword(auth, email.trim(), password);
          playSound("success");
          onSuccess();
        } catch (err) {
          playSound("delete");
          setErrorMsg("เข้าสู่ระบบไม่สำเร็จ อีเมลหรือรหัสผ่านไม่ถูกต้อง");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div
            className={`animate-modal w-full max-w-md rounded-2xl border p-6 sm:p-7 shadow-2xl ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"

          >

    // ==================== MAIN APP COMPONENT ====================
    function App() {
      const [hasManualTheme, setHasManualTheme] = useState(() => {
        try {
          return Boolean(localStorage.getItem("portal_theme"));
        } catch {
          return false;
        }
      });

      const [theme, setTheme] = useState(() => {
        try {
          const saved = localStorage.getItem("portal_theme");
          if (saved === "dark" || saved === "light") return saved;
        } catch {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }
        return "light";
      });

      const isDark = theme === "dark";

      const [soundOn, setSoundOn] = useState(() => isSoundEnabled());
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Listen to live OS/device theme changes when not manually overridden
      useEffect(() => {
        if (!window.matchMedia) return;
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
        const handleSystemThemeChange = (e) => {
          if (!hasManualTheme) {
            setTheme(e.matches ? "dark" : "light");
          }
        };
        if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", handleSystemThemeChange);
          return () => mediaQuery.removeEventListener("change", handleSystemThemeChange);
        } else {
          mediaQuery.addListener(handleSystemThemeChange);
          return () => mediaQuery.removeListener(handleSystemThemeChange);
        }
      }, [hasManualTheme]);

      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.classList.add("dark");
          document.body.className = "bg-black text-white transition-colors duration-300";
        } else {
          root.classList.remove("dark");
          document.body.className = "bg-white text-zinc-950 transition-colors duration-300";
        }
      }, [isDark]);

      const toggleTheme = () => {
        const nextTheme = isDark ? "light" : "dark";
        setTheme(nextTheme);
        setHasManualTheme(true);
        playSound("toggle");
        try {
          localStorage.setItem("portal_theme", nextTheme);
        } catch {}
      };

      const toggleSound = () => {
        if (soundOn && !isAmbientPlaying()) {
          setSoundEnabled(true);
          unlockAudio();
          playSound("toggle");
          return;
        }
        const next = !soundOn;
        setSoundOn(next);
        setSoundEnabled(next);
        if (next) {
          unlockAudio();
          playSound("toggle");
        }
      };

      // Global Web Audio button & link press sound + continuous underwater ambient delegation
      useEffect(() => {
        let lastPressSoundAt = 0;
        const matchInteractive = (target) => {
          if (!target || !target.closest) return null;
          const hit = target.closest(
            'button, a[href], [role="button"], input[type="submit"], input[type="button"], summary'
          );
          if (!hit || hit.getAttribute("data-sound-toggle") === "true") return null;
          return hit;
        };

        if (
          isSoundEnabled() &&
          typeof navigator !== "undefined" &&
          navigator.userActivation &&
          navigator.userActivation.hasBeenActive
        ) {
          unlockAudio();
        }

        const handleTouchStart = (ev) => {
          unlockAudio();
          if (matchInteractive(ev.target)) {
            lastPressSoundAt = Date.now();
            playSound("click", true);
          }
        };

        const handlePointerDown = (ev) => {
          unlockAudio();
          const isPrimary = ev.pointerType === "touch" || ev.button === 0 || ev.button === undefined;
          if (isPrimary && matchInteractive(ev.target)) {
            lastPressSoundAt = Date.now();
            playSound("click", true);
          }
        };

        const handleGlobalClick = (ev) => {
          unlockAudio();
          if (Date.now() - lastPressSoundAt > 300 && matchInteractive(ev.target)) {
            playSound("click", true);
          }
        };

        const handleAnyGestureUnlock = () => unlockAudio();
        const handleVisibility = () => {
          if (document.visibilityState === "visible" && isSoundEnabled()) {
            unlockAudio();
          }
        };

        document.addEventListener("touchstart", handleTouchStart, { capture: true, passive: true });
        document.addEventListener("pointerdown", handlePointerDown, { capture: true, passive: true });
        document.addEventListener("click", handleGlobalClick, { capture: true });
        document.addEventListener("keydown", handleAnyGestureUnlock, { capture: true, passive: true });
        document.addEventListener("visibilitychange", handleVisibility);
        return () => {
          document.removeEventListener("touchstart", handleTouchStart, { capture: true });
          document.removeEventListener("pointerdown", handlePointerDown, { capture: true });
          document.removeEventListener("click", handleGlobalClick, { capture: true });
          document.removeEventListener("keydown", handleAnyGestureUnlock, { capture: true });
          document.removeEventListener("visibilitychange", handleVisibility);
        };
      }, []);

      // Firebase & Data State
      const [fbReady, setFbReady] = useState(Boolean(window.__FB__));
      const [currentUser, setCurrentUser] = useState(null);
      const [remoteProfile, setRemoteProfile] = useState(null);
      const [categories, setCategories] = useState([]);
      const [publicSites, setPublicSites] = useState([]);
      const [privateSites, setPrivateSites] = useState([]);
      const [remoteStories, setRemoteStories] = useState([]);
      const [remoteActivities, setRemoteActivities] = useState([]);
      const [remoteMoments, setRemoteMoments] = useState([]);
      const [remoteComments, setRemoteComments] = useState([]);

      // Local Interactive State
      const [localLikes, setLocalLikes] = useState({});

      const [localComments, setLocalComments] = useState(() => {
        try {
          const raw = localStorage.getItem("portal_local_comments");
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      });
      const [likedStoryIds, setLikedStoryIds] = useState(() => {
        try {
          const raw = localStorage.getItem("portal_liked_stories");

        } catch {

      const [localStories, setLocalStories] = useState(() => {

      const [localActivities, setLocalActivities] = useState(() => {

      const [localMoments, setLocalMoments] = useState(() => {

        } catch {

      const [localCanvasLayouts, setLocalCanvasLayouts] = useState(() => {

          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      });

      const [selectedCategory, setSelectedCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      // Custom In-App Modals
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [homeEditModalOpen, setHomeEditModalOpen] = useState(false);
      const [canvasDesignerOpen, setCanvasDesignerOpen] = useState(false);
      const [categoryModalOpen, setCategoryModalOpen] = useState(false);
      const [siteModalOpen, setSiteModalOpen] = useState(false);
      const [editingSite, setEditingSite] = useState(null);

      // Custom System Confirm & Notice Dialog State
      const [confirmDialog, setConfirmDialog] = useState({
        open: false,
        title: "",
        message: "",

        onConfirm: null,
      });
      const [noticeDialog, setNoticeDialog] = useState({

        title: "",

      });
      const [toastMessage, setToastMessage] = useState("");

        setTimeout(() => {

      const showSystemNotice = (title, message) => {
        setNoticeDialog({ open: true, title, message });
      };

      const showSystemConfirm = ({ title, message, confirmLabel = "ยืนยันการลบ", onConfirm }) => {
        setConfirmDialog({ open: true, title, message, confirmLabel, onConfirm });

      // Wait for Firebase Ready
      useEffect(() => {
        if (window.__FB__) {
          setFbReady(true);
          return;
        }
        const handler = () => setFbReady(true);
        window.addEventListener("firebase-ready", handler);
        return () => window.removeEventListener("firebase-ready", handler);
      }, []);

      // Subscribe to Firebase Auth & Firestore
      useEffect(() => {
        if (!fbReady || !window.__FB__) return;
        const {
          auth,
          db,
          onAuthStateChanged,
          collection,
          doc,
          onSnapshot,
        } = window.__FB__;

        let unsubPrivate = null;

        const unsubHome = onSnapshot(
          doc(db, "site_settings", "home_profile"),
          (snap) => setRemoteProfile(snap.exists() ? snap.data() : null),
          () => {}
        );

        const unsubCats = onSnapshot(
          collection(db, "categories"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
            setCategories(list);
          },
          () => {}
        );

        const unsubPublic = onSnapshot(
          collection(db, "public_websites"),

            const list = snap.docs.map((d) => ({
              id: d.id,
              visibility: "public",
              ...d.data(),
            }));
            setPublicSites(list);
          },
          () => {}
        );

        const unsubStories = onSnapshot(
          collection(db, "stories"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
            setRemoteStories(list);
          },
          () => {}
        );

        const unsubActivities = onSnapshot(
          collection(db, "activities"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.eventDate || "").localeCompare(a.eventDate || ""));
            setRemoteActivities(list);
          },
          () => {}
        );

        const unsubMoments = onSnapshot(
          collection(db, "gallery_moments"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.eventDate || "").localeCompare(a.eventDate || ""));
            setRemoteMoments(list);
          },
          () => {}
        );

        const unsubComments = onSnapshot(
          collection(db, "story_comments"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
            setRemoteComments(list);
          },
          () => {}
        );

        const unsubAuth = onAuthStateChanged(auth, (user) => {
          setCurrentUser(user);
          if (user) {
            if (unsubPrivate) unsubPrivate();
            unsubPrivate = onSnapshot(
              collection(db, "private_websites"),
              (snap) => {
                const list = snap.docs.map((d) => ({
                  id: d.id,
                  visibility: "private",
                  ...d.data(),
                }));
                setPrivateSites(list);
              },
              () => setPrivateSites([])
            );
          } else {
            if (unsubPrivate) {
              unsubPrivate();
              unsubPrivate = null;
            }
            setPrivateSites([]);
          }
        });

        return () => {
          unsubHome();
          unsubCats();
          unsubPublic();
          unsubStories();
          unsubActivities();
          unsubMoments();
          unsubComments();
          unsubAuth();
          if (unsubPrivate) unsubPrivate();
        };
      }, [fbReady]);

      const activeProfile = useMemo(() => {
        const clean = (val) => (val || "").trim();
        const rp = remoteProfile || {};
        const isInitialNull = remoteProfile === null;
        const merged = {
          heroEyebrow: clean(rp.heroEyebrow) || "Natthakn Hahab",
          avatarUrl: clean(rp.avatarUrl),
          fullName: clean(rp.fullName) || (isInitialNull ? "NATTHAKAN HAHAB" : ""),
          role: clean(rp.role) || (isInitialNull ? "นักศึกษาชั้นปีที่ 2" : ""),
          bio: clean(rp.bio),

              >
                <h3 className="text-base font-semibold mb-2">{noticeDialog.title}</h3>
                <p className={`text-sm leading-relaxed mb-6 ${isDark ? "text-zinc-300" : "text-zinc-600"}`}>
                  {noticeDialog.message}
                </p>
                <div className="flex justify-end">
                  <button
                    type="button"
                    onClick={() => {
                      playSound("click");
                      setNoticeDialog({ open: false, title: "", message: "" });
                    }}
                    className={`px-5 py-2 rounded-lg text-sm font-medium ${
                      isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                    }`}
                  >
                    ตกลง
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div
              className={`fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium shadow-xl animate-modal ${
                isDark
                  ? "border-white/15 bg-zinc-900 text-white"
                  : "border-zinc-200 bg-zinc-950 text-white"
              }`}
            >
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
