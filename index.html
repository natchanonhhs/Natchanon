    (function () {

        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var initial = saved ? saved : (prefersDark ? "dark" : "light");
        if (initial === "dark") {

    // ==================== IMAGE COMPRESSION UTILITY ====================
    function compressImageFile(file, maxDim = 320) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("ไม่พบไฟล์รูปภาพ"));
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/webp", 0.85));
          };
          img.onerror = () => reject(new Error("ไม่สามารถประมวลผลไฟล์รูปภาพได้"));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("ไม่สามารถอ่านไฟล์ได้"));
        reader.readAsDataURL(file);
      });
    }

    // ==================== MAIN APP COMPONENT ====================
    function App() {
      // Theme State: Follows device system setting by default, with manual override saved in localStorage
      const [hasManualTheme, setHasManualTheme] = useState(() => {
        try {
          return Boolean(localStorage.getItem("portal_theme"));
        } catch {
          return false;
        }
      });

      const [theme, setTheme] = useState(() => {
        try {
          const saved = localStorage.getItem("portal_theme");
          if (saved === "dark" || saved === "light") return saved;
        } catch {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }
        return "light";
      });

      const isDark = theme === "dark";

      // Listen to live OS/device theme changes when not manually overridden
      useEffect(() => {
        if (!window.matchMedia) return;
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
        const handleSystemThemeChange = (e) => {
          if (!hasManualTheme) {
            setTheme(e.matches ? "dark" : "light");
          }
        };
        if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", handleSystemThemeChange);
          return () => mediaQuery.removeEventListener("change", handleSystemThemeChange);
        } else {
          mediaQuery.addListener(handleSystemThemeChange);
          return () => mediaQuery.removeListener(handleSystemThemeChange);
        }
      }, [hasManualTheme]);

      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.classList.add("dark");
          document.body.className = "bg-black text-white transition-colors duration-300";
        } else {
          root.classList.remove("dark");
          document.body.className = "bg-white text-zinc-950 transition-colors duration-300";
        }
      }, [isDark]);

      const toggleTheme = () => {
        const nextTheme = isDark ? "light" : "dark";
        setTheme(nextTheme);
        setHasManualTheme(true);
        try {
          localStorage.setItem("portal_theme", nextTheme);
        } catch {}
      };

      // Navigation & Mobile Drawer State
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Firebase & Data State
      const [fbReady, setFbReady] = useState(Boolean(window.__FB__));
      const [currentUser, setCurrentUser] = useState(null);
      const [homeProfile, setHomeProfile] = useState(null);
      const [categories, setCategories] = useState([]);
      const [publicSites, setPublicSites] = useState([]);
      const [privateSites, setPrivateSites] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      // Custom In-App System Modals & Popups (ZERO Safari native popups)
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [homeEditModalOpen, setHomeEditModalOpen] = useState(false);
      const [categoryModalOpen, setCategoryModalOpen] = useState(false);
      const [siteModalOpen, setSiteModalOpen] = useState(false);
      const [editingSite, setEditingSite] = useState(null);

      // Custom System Confirm & Notice Dialog State
      const [confirmDialog, setConfirmDialog] = useState({
        open: false,
        title: "",
        message: "",
        confirmLabel: "ยืนยัน",
        onConfirm: null,
      });
      const [noticeDialog, setNoticeDialog] = useState({
        open: false,
        title: "",
        message: "",

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage((prev) => (prev === msg ? "" : prev));
        }, 3200);
      };

      const showSystemNotice = (title, message) => {
        setNoticeDialog({ open: true, title, message });
      };

      const showSystemConfirm = ({ title, message, confirmLabel = "ยืนยันการลบ", onConfirm }) => {
        setConfirmDialog({ open: true, title, message, confirmLabel, onConfirm });
      };

      // Wait for Firebase Ready
      useEffect(() => {
        if (window.__FB__) {
          setFbReady(true);
          return;
        }
        const handler = () => setFbReady(true);
        window.addEventListener("firebase-ready", handler);
        return () => window.removeEventListener("firebase-ready", handler);
      }, []);

      // Subscribe to Firebase Auth & Firestore
      useEffect(() => {
        if (!fbReady || !window.__FB__) return;
        const {
          auth,
          db,
          onAuthStateChanged,
          collection,
          doc,
          onSnapshot,
        } = window.__FB__;

        let unsubPrivate = null;

        const unsubHome = onSnapshot(
          doc(db, "site_settings", "home_profile"),
          (snap) => setHomeProfile(snap.exists() ? snap.data() : null),
          () => {}
        );

        const unsubCats = onSnapshot(
          collection(db, "categories"),
          (snap) => {
            const list = snap.docs
              .map((d) => ({ id: d.id, ...d.data() }))
              .sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
            setCategories(list);
          },
          () => {}
        );

        const unsubPublic = onSnapshot(
          collection(db, "public_websites"),
          (snap) => {
            const list = snap.docs.map((d) => ({
              id: d.id,
              visibility: "public",
              ...d.data(),
            }));
            setPublicSites(list);
          },
          () => {}
        );

        const unsubAuth = onAuthStateChanged(auth, (user) => {
          setCurrentUser(user);
          if (user) {
            if (unsubPrivate) unsubPrivate();
            unsubPrivate = onSnapshot(
              collection(db, "private_websites"),
              (snap) => {
                const list = snap.docs.map((d) => ({
                  id: d.id,
                  visibility: "private",
                  ...d.data(),
                }));
                setPrivateSites(list);
              },
              () => setPrivateSites([])
            );
          } else {
            if (unsubPrivate) {
              unsubPrivate();
              unsubPrivate = null;
            }
            setPrivateSites([]);
          }
        });

        return () => {
          unsubHome();
          unsubCats();
          unsubPublic();
          unsubAuth();
          if (unsubPrivate) unsubPrivate();
        };
      }, [fbReady]);

      // Combined & Filtered Websites
      const combinedSites = useMemo(() => {
        return [...publicSites, ...privateSites].sort(
          (a, b) => (Number(a.order) || 999) - (Number(b.order) || 999)
        );
      }, [publicSites, privateSites]);

      const allCategoryNames = useMemo(() => {
        const fromSaved = categories.map((c) => c.name).filter(Boolean);

        return [...new Set([...fromSaved, ...fromSites])];

        if (selectedCategory !== "all" && !allCategoryNames.includes(selectedCategory)) {
          setSelectedCategory("all");

      }, [allCategoryNames, selectedCategory]);

      const filteredSites = useMemo(() => {
        let list = combinedSites;

              (s.desc || "").toLowerCase().includes(q) ||
              (s.category || "").toLowerCase().includes(q)

            {/* Looping Background Video */}
            <video
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4"
              autoPlay

              loop
              playsInline
              className="absolute inset-0 h-full w-full object-cover object-[70%_center] z-0"
            />

            {/* Theme-Adaptive Scrim Overlay for Legibility in Both Black & White Modes */}
            <div

          onError(err.message);

        setSaving(true);

          await setDoc(
            doc(db, "site_settings", "home_profile"),
            {
              avatarUrl: avatarUrl.trim(),
              fullName: fullName.trim(),
              role: role.trim(),
              bio: bio.trim(),
              stat1Value: stat1Value.trim(),
              stat1Label: stat1Label.trim(),
              stat2Value: stat2Value.trim(),
              stat2Label: stat2Label.trim(),
              stat3Value: stat3Value.trim(),
              stat3Label: stat3Label.trim(),
              education: education.trim(),
              skills: skills.trim(),
              services: services.trim(),
              updatedAt: serverTimestamp(),

            { merge: true }

                          type="button"
                          onClick={() => setAvatarUrl("")}
                          className="text-xs text-rose-500 hover:underline"
                        >
                          ลบรูป
                        </button>
                      )}
                    </div>
                    <input
                      type="text"
                      value={avatarUrl}
                      onChange={(e) => setAvatarUrl(e.target.value)}
                      placeholder="หรือวางลิงก์รูปภาพ https://..."
                      className={inputClass}
                    />
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium mb-1">ชื่อ - นามสกุล *</label>
                  <input type="text" required value={fullName} onChange={(e) => setFullName(e.target.value)} placeholder="ระบุชื่อ-นามสกุล..." className={inputClass} />
                </div>
                <div>
                  <label className="block text-xs font-medium mb-1">ตำแหน่ง / สถานะปัจจุบัน *</label>
                  <input type="text" required value={role} onChange={(e) => setRole(e.target.value)} placeholder="เช่น นักศึกษาวิทยาการคอมพิวเตอร์ / Web Developer" className={inputClass} />
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">ข้อความแนะนำตัว (Bio)</label>
                <textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} placeholder="เขียนแนะนำตัวเอง ประวัติย่อ หรือเป้าหมายในการพัฒนาระบบ..." className={inputClass} />
              </div>

              {/* 3 Highlights */}
              <div className={`rounded-xl border p-3.5 space-y-2.5 ${isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-zinc-50"}`}>
                <div className="text-xs font-medium">ข้อมูลสรุปจุดเด่น (3 กล่องไฮไลต์ - ไม่บังคับ)</div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  <div className="space-y-1.5">
                    <input type="text" value={stat1Value} onChange={(e) => setStat1Value(e.target.value)} placeholder="หัวข้อ 1 (เช่น PSU)" className={inputClass} />
                    <input type="text" value={stat1Label} onChange={(e) => setStat1Label(e.target.value)} placeholder="คำอธิบาย 1" className={inputClass} />
                  </div>
                  <div className="space-y-1.5">
                    <input type="text" value={stat2Value} onChange={(e) => setStat2Value(e.target.value)} placeholder="หัวข้อ 2 (เช่น Full-Stack)" className={inputClass} />
                    <input type="text" value={stat2Label} onChange={(e) => setStat2Label(e.target.value)} placeholder="คำอธิบาย 2" className={inputClass} />
                  </div>
                  <div className="space-y-1.5">
                    <input type="text" value={stat3Value} onChange={(e) => setStat3Value(e.target.value)} placeholder="หัวข้อ 3 (เช่น Hat Yai)" className={inputClass} />
                    <input type="text" value={stat3Label} onChange={(e) => setStat3Label(e.target.value)} placeholder="คำอธิบาย 3" className={inputClass} />
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">การศึกษาและสังกัด</label>
                <textarea rows={2} value={education} onChange={(e) => setEducation(e.target.value)} placeholder="เช่น คณะวิทยาศาสตร์ มหาวิทยาลัยสงขลานครินทร์" className={inputClass} />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">ทักษะและความเชี่ยวชาญ (คั่นด้วยเครื่องหมายจุลภาค , )</label>
                <input type="text" value={skills} onChange={(e) => setSkills(e.target.value)} placeholder="เช่น React, Tailwind CSS, Firebase, Google Apps Script, C" className={inputClass} />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">ความสนใจและงานที่ให้บริการ</label>
                <textarea rows={2} value={services} onChange={(e) => setServices(e.target.value)} placeholder="เช่น พัฒนาระบบเว็บแอปพลิเคชัน ระบบฐานข้อมูล และระบบอัตโนมัติ" className={inputClass} />
              </div>

              <div className="flex items-center justify-end gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl text-sm font-medium border ${
                    isDark ? "border-white/15 text-white/80 hover:bg-white/10" : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                  }`}
                >
                  ยกเลิก
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className={`px-5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  {saving ? "กำลังบันทึก..." : "บันทึกข้อมูลหน้าหลัก"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== MODAL COMPONENT 3: MANAGE CATEGORIES ====================
    function CategoryManageModal({ isDark, categories, onClose, onDeleteCategory, onToast, onError }) {
      const [newName, setNewName] = useState("");
      const [adding, setAdding] = useState(false);

      const handleAdd = async (e) => {
        e.preventDefault();
        const trimmed = newName.trim();
        if (!trimmed || !window.__FB__) return;
        setAdding(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.__FB__;
          await addDoc(collection(db, "categories"), {
            name: trimmed,
            order: categories.length + 1,
            createdAt: serverTimestamp(),
          });
          setNewName("");
          onToast("เพิ่มหมวดหมู่เรียบร้อยแล้ว");
        } catch (err) {
          onError(err.message);
        } finally {
          setAdding(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div
            className={`animate-modal w-full max-w-md rounded-2xl border p-6 shadow-2xl ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            <div className="flex items-center justify-between pb-3 mb-4 border-b border-current/10">
              <h3 className="text-lg font-semibold">จัดการหมวดหมู่ระบบสารสนเทศ</h3>
              <button
                type="button"
                onClick={onClose}
                className={`w-8 h-8 rounded-lg flex items-center justify-center ${
                  isDark ? "hover:bg-white/10 text-white/70" : "hover:bg-zinc-100 text-zinc-500"
                }`}
              >
                <IconX size={18} />
              </button>
            </div>

            <form onSubmit={handleAdd} className="flex gap-2 mb-4">
              <input
                type="text"
                required
                value={newName}
                onChange={(e) => setNewName(e.target.value)}
                placeholder="พิมพ์ชื่อหมวดหมู่ใหม่..."
                className={`flex-grow rounded-xl border px-3.5 py-2 text-sm focus:outline-none ${
                  isDark
                    ? "border-white/15 bg-black text-white focus:border-white/50"
                    : "border-zinc-300 bg-zinc-50 text-zinc-950 focus:border-zinc-900"
                }`}
              />
              <button
                type="submit"
                disabled={adding}
                className={`px-4 py-2 rounded-xl text-sm font-medium shrink-0 ${
                  isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                }`}
              >
                เพิ่ม
              </button>
            </form>

            <div className="space-y-2 max-h-64 overflow-y-auto">
              {categories.length === 0 ? (
                <p className={`text-xs text-center py-6 ${isDark ? "text-white/45" : "text-zinc-400"}`}>
                  ยังไม่มีหมวดหมู่ที่สร้างไว้
                </p>
              ) : (
                categories.map((cat) => (
                  <div
                    key={cat.id}
                    className={`flex items-center justify-between rounded-xl border px-3.5 py-2.5 text-sm ${
                      isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-zinc-50"
                    }`}
                  >
                    <span className="font-medium">{cat.name}</span>
                    <button
                      type="button"
                      onClick={() => onDeleteCategory(cat)}
                      className="text-xs text-rose-500 hover:underline"
                    >
                      ลบ
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==================== MODAL COMPONENT 4: ADD / EDIT WEBSITE ====================
    function SiteFormModal({
      isDark,
      editingSite,
      existingCategories,
      defaultCategory,
      defaultOrder,
      onClose,
      onSaved,
      onError,
    }) {
      const fileInputRef = useRef(null);
      const [imageUrl, setImageUrl] = useState(editingSite?.imageUrl || "");
      const [title, setTitle] = useState(editingSite?.title || "");
      const [url, setUrl] = useState(editingSite?.url || "");
      const [category, setCategory] = useState(editingSite?.category || defaultCategory || "");
      const [categoryDropdownOpen, setCategoryDropdownOpen] = useState(false);
      const [order, setOrder] = useState(editingSite?.order || defaultOrder || 1);
      const [desc, setDesc] = useState(editingSite?.desc || "");
      const [visibility, setVisibility] = useState(editingSite?.visibility || "public");
      const [saving, setSaving] = useState(false);

      const handleFileChange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 256);
          setImageUrl(dataUrl);
        } catch (err) {
          onError(err.message);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!window.__FB__) return;
        setSaving(true);

        const targetCol = visibility === "private" ? "private_websites" : "public_websites";
        const catTrimmed = category.trim();

        const payload = {
          imageUrl: imageUrl.trim(),
          title: title.trim(),
          url: url.trim(),
          category: catTrimmed,
          order: Number(order) || 1,
          desc: desc.trim(),
          updatedAt: window.__FB__.serverTimestamp(),
        };

        try {
          const { db, collection, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } = window.__FB__;

          if (catTrimmed && !existingCategories.includes(catTrimmed)) {
            await addDoc(collection(db, "categories"), {
              name: catTrimmed,
              order: existingCategories.length + 1,
              createdAt: serverTimestamp(),
            });
          }

          if (editingSite) {
            const oldVis = editingSite.visibility || "public";
            if (oldVis !== visibility) {
              const oldCol = oldVis === "private" ? "private_websites" : "public_websites";
              await addDoc(collection(db, targetCol), {
                ...payload,
                createdAt: serverTimestamp(),
              });
              await deleteDoc(doc(db, oldCol, editingSite.id));
            } else {
              await updateDoc(doc(db, targetCol, editingSite.id), payload);
            }
            onSaved("อัปเดตข้อมูลเว็บไซต์เรียบร้อยแล้ว");
          } else {
            await addDoc(collection(db, targetCol), {
              ...payload,
              createdAt: serverTimestamp(),
            });
            onSaved("เพิ่มเว็บไซต์ใหม่เรียบร้อยแล้ว");
          }
        } catch (err) {
          onError(err.message);
        } finally {
          setSaving(false);
        }
      };

      const inputClass = `w-full rounded-xl border px-3.5 py-2 text-sm focus:outline-none ${
        isDark
          ? "border-white/15 bg-black text-white focus:border-white/50"
          : "border-zinc-300 bg-zinc-50 text-zinc-950 focus:border-zinc-900"
      }`;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto">
          <div
            className={`animate-modal w-full max-w-lg rounded-2xl border p-6 sm:p-7 shadow-2xl my-8 max-h-[90vh] overflow-y-auto ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            <div className="flex items-center justify-between pb-3 mb-4 border-b border-current/10">
              <h3 className="text-lg font-semibold">
                {editingSite ? "แก้ไขข้อมูลเว็บไซต์" : "เพิ่มเว็บไซต์ใหม่"}
              </h3>
              <button
                type="button"
                onClick={onClose}
                className={`w-8 h-8 rounded-lg flex items-center justify-center ${
                  isDark ? "hover:bg-white/10 text-white/70" : "hover:bg-zinc-100 text-zinc-500"
                }`}
              >
                <IconX size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              {/* Custom Image Uploader */}
              <div className={`rounded-xl border p-3.5 ${isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-zinc-50"}`}>
                <label className="block text-xs font-medium mb-2">รูปภาพ / โลโก้เว็บไซต์ (เลือกรูปภาพ หรือ วางลิงก์)</label>
                <div className="flex items-center gap-3.5">
                  {imageUrl && (
                    <img src={imageUrl} alt="Preview" className="w-16 h-16 rounded-xl object-cover border border-current/15 shrink-0" />
                  )}
                  <div className="flex-grow space-y-2 min-w-0">
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept="image/*"
                      onChange={handleFileChange}
                      className="hidden"
                    />
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border ${
                          isDark
                            ? "border-white/20 bg-white/10 text-white hover:bg-white/20"
                            : "border-zinc-300 bg-white text-zinc-900 hover:bg-zinc-100"
                        }`}
                      >
                        <IconUpload size={13} />
                        <span>เลือกรูปภาพ</span>
                      </button>
                      {imageUrl && (
                        <button
                          type="button"
                          onClick={() => setImageUrl("")}
                          className="text-xs text-rose-500 hover:underline"
                        >
                          ลบรูป
                        </button>
                      )}
                    </div>
                    <input
                      type="text"
                      value={imageUrl}
                      onChange={(e) => setImageUrl(e.target.value)}
                      placeholder="หรือวางลิงก์รูปภาพ https://..."
                      className={inputClass}
                    />
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">ชื่อเว็บไซต์ / ระบบสารสนเทศ *</label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="ระบุชื่อเว็บไซต์..."
                  className={inputClass}
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">ลิงก์ URL เว็บไซต์ *</label>
                <input
                  type="url"
                  required
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://..."
                  className={inputClass}
                />
              </div>

              {/* Custom Category Selector + Order (ZERO native <select>/<datalist>) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="relative">
                  <label className="block text-xs font-medium mb-1">หมวดหมู่ *</label>
                  <div className="relative flex items-center">
                    <input
                      type="text"
                      required
                      value={category}
                      onFocus={() => existingCategories.length > 0 && setCategoryDropdownOpen(true)}
                      onChange={(e) => setCategory(e.target.value)}
                      placeholder="พิมพ์หรือเลือกหมวดหมู่..."
                      className={`${inputClass} pr-9`}
                    />
                    {existingCategories.length > 0 && (
                      <button
                        type="button"
                        onClick={() => setCategoryDropdownOpen((prev) => !prev)}
                        aria-label="เลือกหมวดหมู่"
                        className={`absolute right-2.5 p-1 rounded ${
                          isDark ? "text-white/60 hover:text-white" : "text-zinc-500 hover:text-zinc-900"
                        }`}
                      >
                        <IconChevronDown size={15} />
                      </button>
                    )}
                  </div>

                  {/* Custom System Dropdown Option Menu */}
                  {categoryDropdownOpen && existingCategories.length > 0 && (
                    <div
                      className={`absolute left-0 right-0 mt-1.5 z-30 rounded-xl border p-1.5 shadow-xl max-h-44 overflow-y-auto ${
                        isDark
                          ? "border-white/15 bg-zinc-900 text-white"
                          : "border-zinc-200 bg-white text-zinc-950"
                      }`}
                    >
                      {existingCategories.map((catName) => {
                        const selected = category === catName;
                        return (
                          <button
                            key={catName}
                            type="button"
                            onClick={() => {
                              setCategory(catName);
                              setCategoryDropdownOpen(false);
                            }}
                            className={`w-full text-left px-3 py-2 rounded-lg text-xs flex items-center justify-between transition-colors ${
                              selected
                                ? isDark
                                  ? "bg-white text-black font-medium"
                                  : "bg-zinc-950 text-white font-medium"
                                : isDark
                                  ? "hover:bg-white/10 text-white/85"
                                  : "hover:bg-zinc-100 text-zinc-800"
                            }`}
                          >
                            <span className="truncate">{catName}</span>
                            {selected && <IconCheck size={13} />}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div>
                  <label className="block text-xs font-medium mb-1">ลำดับการแสดงผล (น้อยขึ้นก่อน)</label>
                  <input
                    type="number"
                    min={1}
                    value={order}
                    onChange={(e) => setOrder(e.target.value)}
                    className={inputClass}
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">คำอธิบายเพิ่มเติม (ไม่บังคับ)</label>
                <textarea
                  rows={2}
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  placeholder="อธิบายสั้นๆ เกี่ยวกับเว็บไซต์นี้..."
                  className={inputClass}
                />
              </div>

              {/* Custom System Visibility Option Buttons */}
              <div>
                <label className="block text-xs font-medium mb-1.5">สิทธิ์การมองเห็น</label>
                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    type="button"
                    onClick={() => setVisibility("public")}
                    className={`flex items-center justify-center gap-2 p-2.5 rounded-xl border text-xs font-medium transition-all ${
                      visibility === "public"
                        ? isDark
                          ? "border-white bg-white text-black"
                          : "border-zinc-950 bg-zinc-950 text-white"
                        : isDark
                          ? "border-white/15 bg-black text-white/70 hover:border-white/30"
                          : "border-zinc-200 bg-zinc-50 text-zinc-600 hover:border-zinc-400"
                    }`}
                  >
                    <IconGlobe size={14} />
                    <span>สาธารณะ (ทุกคนเห็น)</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setVisibility("private")}
                    className={`flex items-center justify-center gap-2 p-2.5 rounded-xl border text-xs font-medium transition-all ${
                      visibility === "private"
                        ? "border-amber-500 bg-amber-500 text-black"
                        : isDark
                          ? "border-white/15 bg-black text-white/70 hover:border-white/30"
                          : "border-zinc-200 bg-zinc-50 text-zinc-600 hover:border-zinc-400"
                    }`}
                  >
                    <IconLock size={14} />
                    <span>ส่วนตัว (เห็นคนเดียว)</span>
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-end gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl text-sm font-medium border ${
                    isDark ? "border-white/15 text-white/80 hover:bg-white/10" : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                  }`}
                >
                  ยกเลิก
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className={`px-5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  {saving ? "กำลังบันทึก..." : "บันทึกข้อมูล"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
