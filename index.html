              </div>
              <div>
                <h4 className="text-sm font-semibold mb-3">ความคิดเห็นต่อบทความ จำนวน {comments.filter((c) => c.storyId === activeStory.id).length} รายการ</h4>
                <form onSubmit={async (e) => { e.preventDefault(); const fd = new FormData(e.currentTarget); await fb.addDoc(fb.collection(fb.db, "story_comments"), { storyId: activeStory.id, author: String(fd.get("au") || "").trim(), message: String(fd.get("msg") || "").trim(), createdAt: new Date().toISOString().slice(0, 10) }); e.currentTarget.reset(); playSound("success"); showToast("บันทึกความคิดเห็นแล้ว"); }} className="space-y-2.5 mb-5">
                  <input name="au" required placeholder="ชื่อผู้แสดงความคิดเห็น" className={inp} /><textarea name="msg" rows={2} required placeholder="ข้อคิดเห็นเพิ่มเติม" className={inp} />
                  <button type="submit" className={`px-4 py-2 rounded-xl text-xs font-medium ${isDark ? "bg-white text-black" : "bg-zinc-950 text-white"}`}>ส่งความคิดเห็น</button>
                </form>
                <div className="space-y-2.5">{comments.filter((c) => c.storyId === activeStory.id).map((c) => <div key={c.id} className="rounded-xl border border-current/10 p-3.5 text-sm"><div className="flex justify-between text-xs opacity-65 mb-1"><span className="font-medium opacity-100">{c.author}</span><span>{fmtDate(c.createdAt)}</span></div><p>{c.message}</p></div>)}</div>
              </div>
            </Modal>
          )}

          {lightboxIdx !== null && mergedGallery[lightboxIdx] && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="max-w-4xl w-full flex flex-col items-center text-white">
                <div className="w-full flex items-center justify-between mb-3">
                  <div className="text-xs text-zinc-300">{[mergedGallery[lightboxIdx].category, fmtDate(mergedGallery[lightboxIdx].eventDate), mergedGallery[lightboxIdx].location].filter(Boolean).join(" · ")}</div>
                  <button type="button" onClick={() => setLightboxIdx(null)} aria-label="ปิดภาพ" className="p-2 rounded-lg bg-white/10 hover:bg-white/20"><Icon name="x" /></button>
                </div>
                <div className="relative w-full flex items-center justify-center">
                  <button type="button" onClick={() => setLightboxIdx((i) => (i - 1 + mergedGallery.length) % mergedGallery.length)} aria-label="ภาพก่อนหน้า" className="absolute left-2 w-10 h-10 rounded-full bg-black/60 border border-white/20 flex items-center justify-center"><Icon name="left" /></button>
                  <img src={mergedGallery[lightboxIdx].imageUrl} alt={mergedGallery[lightboxIdx].caption} className="max-h-[72vh] rounded-xl object-contain border border-white/15" />
                  <button type="button" onClick={() => setLightboxIdx((i) => (i + 1) % mergedGallery.length)} aria-label="ภาพถัดไป" className="absolute right-2 w-10 h-10 rounded-full bg-black/60 border border-white/20 flex items-center justify-center"><Icon name="right" /></button>
                </div>
                <div className="mt-4 text-center max-w-2xl">
                  {mergedGallery[lightboxIdx].eventTitle && <div className="text-base font-medium mb-1">{mergedGallery[lightboxIdx].eventTitle}</div>}
                  {mergedGallery[lightboxIdx].caption && <p className="text-sm text-zinc-300">{mergedGallery[lightboxIdx].caption}</p>}
                </div>
              </div>
            </div>
          )}

          {confirmDlg && (
            <Modal title={confirmDlg.title} isDark={isDark} onClose={() => setConfirmDlg(null)} maxW="max-w-md">
              <p className="text-sm opacity-75 mb-5">{confirmDlg.msg}</p>
              <div className="flex justify-end gap-2"><button type="button" onClick={() => setConfirmDlg(null)} className="px-4 py-2 rounded-xl border border-current/20 text-sm">ยกเลิก</button><button type="button" onClick={async () => { const run = confirmDlg.run; setConfirmDlg(null); await run(); }} className="px-5 py-2 rounded-xl bg-rose-600 text-white text-sm font-medium">ยืนยันการลบ</button></div>
            </Modal>
          )}

          {noticeDlg && (
            <Modal title={noticeDlg.title} isDark={isDark} onClose={() => setNoticeDlg(null)} maxW="max-w-md">
              <p className="text-sm opacity-75 mb-5">{noticeDlg.msg}</p>
              <button type="button" onClick={() => setNoticeDlg(null)} className={`w-full py-2.5 rounded-xl text-sm font-medium ${isDark ? "bg-white text-black" : "bg-zinc-950 text-white"}`}>รับทราบ</button>
            </Modal>
          )}

          {toast && <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-zinc-900 text-white text-xs sm:text-sm shadow-xl">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
