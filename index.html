    const SOUND_STORAGE_KEY = "portal_sound_enabled";
    let audioCtxInstance = null;
    let audioUnlockedFlag = false;
    let lastDelegatedSoundAt = 0;

    let ambientAudioEl = null;
    let ambientAudioUrl = null;
    let ambientStartingFlag = false;
    const sfxAudioUrls = {};

    function encodePcm16MonoWav(samples, sampleRate = 22050) {
      const numSamples = samples.length;
      const dataSize = numSamples * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);
      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);
      let offset = 44;
      for (let i = 0; i < numSamples; i++) {
        const clamped = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true);
        offset += 2;
      }
      return new Uint8Array(buffer);
    }

    function wavBytesToBlobUrl(wavBytes) {
      const copy = new Uint8Array(wavBytes.length);
      copy.set(wavBytes);
      const blob = new Blob([copy.buffer], { type: "audio/wav" });
      return URL.createObjectURL(blob);
    }

    function createSeededRng(seed = 1337) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function generateAmbientUnderwaterSamples(sampleRate = 22050, durationSec = 10) {
      const length = Math.floor(sampleRate * durationSec);
      const samples = new Float32Array(length);
      const rng = createSeededRng(202611);
      let lp1 = 0;
      let lp2 = 0;
      let lp3 = 0;
      let hpPrev = 0;
      let hpOut = 0;

      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const white = rng() * 2 - 1;
        const swell =
          0.78 +
          0.22 * Math.sin((2 * Math.PI * 1 * t) / durationSec) * 0.7 +
          0.12 * Math.sin((2 * Math.PI * 2 * t) / durationSec + 0.9);
        lp1 = lp1 + 0.08 * (white - lp1);
        lp2 = lp2 + 0.11 * (lp1 - lp2);
        lp3 = lp3 + 0.15 * (lp2 - lp3);
        hpOut = 0.975 * (hpOut + lp3 - hpPrev);
        hpPrev = lp3;
        samples[i] = hpOut * 0.36 * swell;
      }

      const glides = [
        { start: 1.4, dur: 1.25, amp: 0.11 },
        { start: 6.2, dur: 1.35, amp: 0.1 },
      ];
      for (const g of glides) {
        const startIdx = Math.floor(g.start * sampleRate);
        const gLen = Math.floor(g.dur * sampleRate);
        let gLp1 = 0;
        let gLp2 = 0;
        for (let j = 0; j < gLen; j++) {
          const idx = (startIdx + j) % length;
          const p = j / gLen;
          const env = Math.pow(Math.sin(Math.PI * p), 1.6);
          const noise = rng() * 2 - 1;
          const alpha = 0.11 - p * 0.05;
          gLp1 = gLp1 + alpha * (noise - gLp1);
          gLp2 = gLp2 + 0.18 * (gLp1 - gLp2);
          samples[idx] += gLp2 * env * g.amp;
        }
      }

      const bubbles = [
        { time: 0.85, f0: 270, f1: 540, dur: 0.11, amp: 0.14 },
        { time: 3.1, f0: 310, f1: 620, dur: 0.095, amp: 0.12 },
        { time: 3.3, f0: 360, f1: 690, dur: 0.085, amp: 0.09 },
        { time: 5.75, f0: 250, f1: 510, dur: 0.115, amp: 0.13 },
        { time: 8.2, f0: 295, f1: 590, dur: 0.1, amp: 0.12 },
      ];
      for (const b of bubbles) {
        const startIdx = Math.floor(b.time * sampleRate);
        const bLen = Math.floor(b.dur * sampleRate);
        let phase = 0;
        for (let j = 0; j < bLen; j++) {
          const idx = (startIdx + j) % length;
          const p = j / bLen;
          const freq = b.f0 * Math.pow(b.f1 / b.f0, p);
          phase += (2 * Math.PI * freq) / sampleRate;
          const env = Math.sin(Math.PI * p) * Math.pow(1 - p * 0.35, 1.3);
          samples[idx] += Math.sin(phase) * env * b.amp;
        }
      }

      const fadeSamples = Math.floor(sampleRate * 0.35);
      for (let i = 0; i < fadeSamples; i++) {
        const w = i / fadeSamples;
        const head = samples[i];
        const tail = samples[length - fadeSamples + i];
        samples[i] = head * w + tail * (1 - w);
      }

      for (let i = 0; i < length; i++) {
        samples[i] = Math.tanh(samples[i] * 0.95) * 0.55;
      }
      return samples;
    }

    function generateClickSamples(type = "click", sampleRate = 22050) {
      const durations = {
        click: 0.036,
        toggle: 0.068,
        open: 0.062,
        success: 0.16,
        delete: 0.075,
        snap: 0.024,
      };
      const dur = durations[type] || 0.036;
      const length = Math.floor(sampleRate * dur);
      const samples = new Float32Array(length);

      if (type === "click") {
        let phTick = 0;
        let phBody = 0;
        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          const attack = Math.min(1, t / 0.0015);
          const tickFreq = 1650 * Math.pow(480 / 1650, Math.min(1, t / 0.016));
          const bodyFreq = 260 * Math.pow(110 / 260, Math.min(1, t / 0.025));
          phTick += (2 * Math.PI * tickFreq) / sampleRate;
          phBody += (2 * Math.PI * bodyFreq) / sampleRate;
          const tickEnv = attack * Math.exp(-t / 0.0075);
          const bodyEnv = attack * Math.exp(-t / 0.011);
          samples[i] = Math.sin(phTick) * 0.42 * tickEnv + Math.sin(phBody) * 0.28 * bodyEnv;
        }
        return samples;
      }
      if (type === "toggle") {
        let ph1 = 0;
        let ph2 = 0;
        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          ph1 += (2 * Math.PI * 1150) / sampleRate;
          ph2 += (2 * Math.PI * 1550) / sampleRate;
          const e1 = t < 0.025 ? Math.min(1, t / 0.0015) * Math.exp(-t / 0.007) : 0;
          const t2 = t - 0.026;
          const e2 = t2 >= 0 ? Math.min(1, t2 / 0.0015) * Math.exp(-t2 / 0.009) : 0;
          samples[i] = Math.sin(ph1) * 0.34 * e1 + Math.sin(ph2) * 0.4 * e2;
        }
        return samples;
      }
      if (type === "open") {
        let ph = 0;
        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          const attack = Math.min(1, t / 0.002);
          const f = 580 * Math.pow(920 / 580, t / dur);
          ph += (2 * Math.PI * f) / sampleRate;
          samples[i] = Math.sin(ph) * 0.38 * attack * Math.exp(-t / 0.018);
        }
        return samples;
      }
      if (type === "success") {
        const notes = [
          { start: 0, dur: 0.08, freq: 660 },
          { start: 0.055, dur: 0.1, freq: 880 },
        ];
        for (const n of notes) {
          const sIdx = Math.floor(n.start * sampleRate);
          const nLen = Math.floor(n.dur * sampleRate);
          let ph = 0;
          for (let j = 0; j < nLen && sIdx + j < length; j++) {
            const t = j / sampleRate;
            const attack = Math.min(1, t / 0.002);
            ph += (2 * Math.PI * n.freq) / sampleRate;
            samples[sIdx + j] += Math.sin(ph) * 0.32 * attack * Math.exp(-t / 0.032);
          }
        }
        return samples;
      }
      if (type === "delete") {
        let ph = 0;
        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          const attack = Math.min(1, t / 0.002);
          const f = 380 * Math.pow(190 / 380, t / dur);
          ph += (2 * Math.PI * f) / sampleRate;
          samples[i] = Math.sin(ph) * 0.38 * attack * Math.exp(-t / 0.02);
        }
        return samples;
      }
      let ph = 0;
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const attack = Math.min(1, t / 0.001);
        const f = 1400 * Math.pow(620 / 1400, t / dur);
        ph += (2 * Math.PI * f) / sampleRate;
        samples[i] = Math.sin(ph) * 0.32 * attack * Math.exp(-t / 0.006);
      }
      return samples;
    }

    function getAudioContext() {
      if (typeof window === "undefined") return null;
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      if (!audioCtxInstance || audioCtxInstance.state === "closed") {
        audioCtxInstance = new Ctor();
      }
      return audioCtxInstance;
    }

    function getAmbientAudioElement() {
      if (typeof window === "undefined" || typeof Audio === "undefined") return null;
      if (!ambientAudioEl) {
        try {
          if (!ambientAudioUrl) {
            const samples = generateAmbientUnderwaterSamples(22050, 10);
            const wav = encodePcm16MonoWav(samples, 22050);
            ambientAudioUrl = wavBytesToBlobUrl(wav);
          }
          const el = new Audio(ambientAudioUrl);
          el.loop = true;
          el.preload = "auto";
          el.volume = 0.24;
          el.playsInline = true;
          el.setAttribute("playsinline", "true");
          el.setAttribute("webkit-playsinline", "true");
          ambientAudioEl = el;
        } catch (e) {
          return null;
        }
      }
      return ambientAudioEl;
    }

    function getSfxUrl(type) {
      if (typeof window === "undefined") return null;
      if (sfxAudioUrls[type]) return sfxAudioUrls[type];
      try {
        const samples = generateClickSamples(type, 22050);
        const wav = encodePcm16MonoWav(samples, 22050);
        const url = wavBytesToBlobUrl(wav);
        sfxAudioUrls[type] = url;
        return url;
      } catch (e) {
        return null;
      }
    }

    function playHtmlSfx(type) {
      try {
        const url = getSfxUrl(type);
        if (!url || typeof Audio === "undefined") return;
        const el = new Audio(url);
        el.volume = 0.45;
        el.playsInline = true;
        const p = el.play();
        if (p && typeof p.catch === "function") p.catch(() => {});
      } catch (e) {}
    }

    function isAmbientPlaying() {
      if (!ambientAudioEl) return false;
      return !ambientAudioEl.paused && !ambientAudioEl.ended;
    }

    function startAmbientWater() {
      if (!isSoundEnabled()) return;
      const el = getAmbientAudioElement();
      if (!el || !el.paused || ambientStartingFlag) return;
      ambientStartingFlag = true;
      try {
        el.volume = 0.24;
        const promise = el.play();
        if (promise && typeof promise.then === "function") {
          promise
            .then(() => {
              ambientStartingFlag = false;
            })
            .catch(() => {
              ambientStartingFlag = false;
            });
        } else {
          ambientStartingFlag = false;
        }
      } catch (e) {
        ambientStartingFlag = false;
      }
    }

    function stopAmbientWater() {
      ambientStartingFlag = false;
      if (!ambientAudioEl) return;
      try {
        ambientAudioEl.pause();
      } catch (e) {}
    }

    function syncAmbientSound(enabled = isSoundEnabled()) {
      if (!enabled) {
        stopAmbientWater();
        return;
      }
      startAmbientWater();
    }

    function unlockAudio() {
      if (isSoundEnabled()) {
        startAmbientWater();
      }
      const ctx = getAudioContext();
      if (!ctx) return null;
      if (ctx.state === "suspended") {
        ctx.resume().catch(() => {});
      }
      if (!audioUnlockedFlag) {
        audioUnlockedFlag = true;
        try {
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
      }
      return ctx;
    }

    function isSoundEnabled() {
      if (typeof window === "undefined") return true;
      try {
        const saved = localStorage.getItem(SOUND_STORAGE_KEY);
        if (saved === null) return true;
        return saved === "true";
      } catch (e) {
        return true;
      }
    }

    function setSoundEnabled(enabled) {
      if (typeof window === "undefined") return;
      try {
        localStorage.setItem(SOUND_STORAGE_KEY, String(enabled));
      } catch (e) {}
      syncAmbientSound(enabled);
    }

    function triggerTone(ctx, type) {
      try {
        const now = ctx.currentTime;

        if (type === "click") {
          const tickOsc = ctx.createOscillator();
          const tickGain = ctx.createGain();
          tickOsc.type = "sine";
          tickOsc.frequency.setValueAtTime(1650, now);
          tickOsc.frequency.exponentialRampToValueAtTime(480, now + 0.016);
          tickGain.gain.setValueAtTime(0.001, now);
          tickGain.gain.linearRampToValueAtTime(0.3, now + 0.0015);
          tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
          tickOsc.connect(tickGain);
          tickGain.connect(ctx.destination);
          tickOsc.start(now);
          tickOsc.stop(now + 0.026);

          const bodyOsc = ctx.createOscillator();
          const bodyGain = ctx.createGain();
          bodyOsc.type = "triangle";
          bodyOsc.frequency.setValueAtTime(260, now);
          bodyOsc.frequency.exponentialRampToValueAtTime(110, now + 0.024);
          bodyGain.gain.setValueAtTime(0.001, now);
          bodyGain.gain.linearRampToValueAtTime(0.2, now + 0.0015);
          bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
          bodyOsc.connect(bodyGain);
          bodyGain.connect(ctx.destination);
          bodyOsc.start(now);
          bodyOsc.stop(now + 0.032);
          return;
        }

        if (type === "toggle") {
          [
            { offset: 0, f: 1150 },
            { offset: 0.026, f: 1550 },
          ].forEach((step) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t = now + step.offset;
            osc.type = "sine";
            osc.frequency.setValueAtTime(step.f, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.24, t + 0.0015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.022);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.025);
          });
          return;
        }

        if (type === "open") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.045);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.24, now + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.052);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.056);
          return;
        }

        if (type === "success") {
          [
            { offset: 0, freq: 660 },
            { offset: 0.055, freq: 880 },
          ].forEach((n) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t = now + n.offset;
            osc.type = "sine";
            osc.frequency.setValueAtTime(n.freq, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.22, t + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.095);
          });
          return;
        }

        if (type === "delete") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.055);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.24, now + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.062);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.068);
          return;
        }

        if (type === "snap") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.018);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.001);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.024);
        }
      } catch (e) {}
    }

    function playSound(type = "click", fromGlobalDelegation = false) {
      if (!isSoundEnabled()) return;
      const nowMs = Date.now();
      if (fromGlobalDelegation) {
        if (nowMs - lastDelegatedSoundAt < 90) return;
        lastDelegatedSoundAt = nowMs;
      }
      startAmbientWater();
      const ctx = unlockAudio();
      if (ctx && ctx.state === "running") {
        triggerTone(ctx, type);
        return;
      }
      playHtmlSfx(type);
      if (ctx && ctx.state === "suspended") {
        ctx.resume().catch(() => {});
      }
    }

    // ==================== IMAGE COMPRESSION UTILITY ====================
    function compressImageFile(file, maxDim = 720) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("ไม่พบไฟล์รูปภาพ"));
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }

            const encodeCanvas = (width, height, mime, quality) => {
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(width));
              canvas.height = Math.max(1, Math.round(height));
              const ctx = canvas.getContext("2d");
              if (!ctx) return "";
              if (mime === "image/jpeg") {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              return canvas.toDataURL(mime, quality);
            };

            const testWebp = encodeCanvas(2, 2, "image/webp", 0.8);
            const preferredMime = testWebp.startsWith("data:image/webp")
              ? "image/webp"
              : "image/jpeg";

            let currentW = w;
            let currentH = h;
            let result = encodeCanvas(currentW, currentH, preferredMime, 0.82);
            if (!result) {
              reject(new Error("ไม่สามารถประมวลผลรูปภาพได้"));
              return;
            }

            const maxDataUrlChars = 360000;
            const qualities = [0.72, 0.58, 0.45];
            for (const q of qualities) {
              if (result.length <= maxDataUrlChars) break;
              result = encodeCanvas(currentW, currentH, preferredMime, q);
            }

            let attempts = 0;
            while (
              result.length > maxDataUrlChars &&
              attempts < 4 &&
              Math.max(currentW, currentH) > 260
            ) {
              currentW = Math.round(currentW * 0.75);
              currentH = Math.round(currentH * 0.75);
              result = encodeCanvas(currentW, currentH, "image/jpeg", 0.65);
              attempts++;
            }

            resolve(result);
          };
          img.onerror = () => reject(new Error("ไม่สามารถประมวลผลไฟล์รูปภาพได้"));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("ไม่สามารถอ่านไฟล์ได้"));
        reader.readAsDataURL(file);
      });
    }

    const THAI_MONTHS = [
      "มกราคม",
      "กุมภาพันธ์",
      "มีนาคม",
      "เมษายน",
      "พฤษภาคม",
      "มิถุนายน",
      "กรกฎาคม",
      "สิงหาคม",
      "กันยายน",

      "ธันวาคม",
    ];

    function estimateReadingMinutes(content) {
      const trimmed = (content || "").trim();
      if (!trimmed) return 1;
      const charCount = trimmed.replace(/\s+/g, "").length;
      return Math.max(1, Math.ceil(charCount / 420));
    }

    function generateSlug(title) {
      const base = (title || "")
        .trim()
        .toLowerCase()
        .replace(/[^\u0E00-\u0E7Fa-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      return base || "story-entry";
    }

    function extractBuddhistYear(dateStr) {
      const trimmed = (dateStr || "").trim();
      if (!trimmed) return "";

      const isoMatch = trimmed.match(/^(\d{4})/);
      if (isoMatch) {
        const yearNum = Number(isoMatch[1]);
        if (yearNum >= 2400) return String(yearNum);
        if (yearNum >= 1900) return String(yearNum + 543);
      }

      const fourDigit = trimmed.match(/(\d{4})/);
      if (fourDigit) {
        const num = Number(fourDigit[1]);
        return num >= 2400 ? String(num) : String(num + 543);
      }

      return "";
    }

    function formatFormalThaiDate(dateStr) {
      const trimmed = (dateStr || "").trim();
      if (!trimmed) return "";
      const match = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return trimmed;
      const rawYear = Number(match[1]);
      const monthIdx = Number(match[2]) - 1;
      const day = Number(match[3]);
      const beYear = rawYear >= 2400 ? rawYear : rawYear + 543;
      const monthName = THAI_MONTHS[monthIdx] || "";
      return `${day} ${monthName} พ.ศ. ${beYear}`;
    }

    function filterStories(stories, options) {
      const q = (options.query || "").trim().toLowerCase();
      const cat = options.category || "all";
      const tag = options.tag || "all";

      return stories.filter((story) => {
        if (cat !== "all" && story.category !== cat) return false;
        if (tag !== "all" && !(story.tags || []).includes(tag)) return false;
        if (q) {
          const hay = `${story.title || ""} ${story.content || ""} ${story.category || ""} ${(story.tags || []).join(" ")}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function filterActivities(activities, options) {
      const q = (options.query || "").trim().toLowerCase();
      const cat = options.category || "all";
      const year = options.year || "all";

      return activities.filter((act) => {
        if (cat !== "all" && act.category !== cat) return false;
        if (year !== "all" && act.buddhistYear !== year) return false;
        if (q) {
          const hay = `${act.title || ""} ${act.summary || ""} ${act.location || ""} ${act.role || ""} ${act.category || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function collectGalleryFromActivitiesAndMoments(activities, moments) {
      const fromMoments = moments.filter((m) =>
        Boolean(m.imageUrl || m.caption || m.eventTitle)
      );
      const fromActivities = [];

      for (const act of activities) {
        const images = act.galleryImages || [];
        for (let i = 0; i < images.length; i++) {
          const url = images[i];
          if (!url) continue;
          const alreadyExists = fromMoments.some((m) => m.imageUrl === url);
          if (!alreadyExists) {
            const captionParts = [act.title, act.location ? `ณ ${act.location}` : ""]
              .filter(Boolean)
              .join(" ");
            fromActivities.push({
              id: `act-${act.id}-img-${i}`,
              imageUrl: url,
              caption: captionParts,
              eventTitle: act.title,
              eventDate: act.eventDate,
              location: act.location,
              category: act.category,
              isLocalSeed: act.isLocalSeed,
            });
          }
        }
      }

      return [...fromMoments, ...fromActivities];
    }

    // ==================== FREEFORM CANVAS LAYOUT ENGINE ====================
    const MIN_ELEMENT_WIDTH_PCT = 4;
    const MIN_ELEMENT_HEIGHT_PCT = 4;

    function getPublicDefaultDeviceFromWidth(width) {
      if (width < 640) return "mobile";
      return "desktop";
    }

    function snapValue(value, step) {
      if (!step || step <= 0) return Math.round(value * 10) / 10;
      return Math.round(value / step) * step;
    }

    function clampElementBounds(el) {
      const w = Math.max(MIN_ELEMENT_WIDTH_PCT, Math.min(100, el.w));
      const h = Math.max(MIN_ELEMENT_HEIGHT_PCT, Math.min(100, el.h));
      const x = Math.max(0, Math.min(100 - w, el.x));
      const y = Math.max(0, Math.min(100 - h, el.y));
      return {
        ...el,
        x: Math.round(x * 10) / 10,
        y: Math.round(y * 10) / 10,
        w: Math.round(w * 10) / 10,
        h: Math.round(h * 10) / 10,
      };
    }

    function clampImageCrop(scale, posX, posY) {
      const s = Math.max(1, Math.min(3, Math.round((scale ?? 1) * 100) / 100));
      const px = Math.max(0, Math.min(100, Math.round((posX ?? 50) * 10) / 10));
      const py = Math.max(0, Math.min(100, Math.round((posY ?? 50) * 10) / 10));
      return { imageScale: s, imagePosX: px, imagePosY: py };
    }

    function applyAspectRatioPreset(el, aspectRatio, canvasWidthPx, canvasHeightPx) {
      if (!aspectRatio || canvasWidthPx <= 0 || canvasHeightPx <= 0) return el;
      const boxWidthPx = (el.w / 100) * canvasWidthPx;
      const targetHeightPx = boxWidthPx / aspectRatio;
      let newH = (targetHeightPx / canvasHeightPx) * 100;
      let newW = el.w;

      if (el.y + newH > 100) {
        newH = Math.max(MIN_ELEMENT_HEIGHT_PCT, 100 - el.y);
        const maxHeightPx = (newH / 100) * canvasHeightPx;
        const adjustedWidthPx = maxHeightPx * aspectRatio;
        newW = Math.min(100 - el.x, (adjustedWidthPx / canvasWidthPx) * 100);
      }

      return clampElementBounds({
        ...el,
        w: newW,
        h: newH,
      });
    }

    function applyDragDelta(el, dxPct, dyPct, snapStep = 1) {
      const rawX = el.x + dxPct;
      const rawY = el.y + dyPct;
      const snappedX = snapStep > 0 ? snapValue(rawX, snapStep) : rawX;
      const snappedY = snapStep > 0 ? snapValue(rawY, snapStep) : rawY;
      return clampElementBounds({
        ...el,
        x: snappedX,
        y: snappedY,
      });
    }

    function applyResizeDelta(el, handle, dxPct, dyPct, snapStep = 1) {
      let { x, y, w, h } = el;
      const right = x + w;
      const bottom = y + h;

      if (handle.includes("e")) {
        const newW = snapValue(w + dxPct, snapStep);
        w = Math.max(MIN_ELEMENT_WIDTH_PCT, Math.min(100 - x, newW));
      }
      if (handle.includes("s")) {
        const newH = snapValue(h + dyPct, snapStep);
        h = Math.max(MIN_ELEMENT_HEIGHT_PCT, Math.min(100 - y, newH));
      }
      if (handle.includes("w")) {
        const rawX = snapValue(x + dxPct, snapStep);
        const clampedX = Math.max(0, Math.min(right - MIN_ELEMENT_WIDTH_PCT, rawX));
        w = right - clampedX;
        x = clampedX;
      }
      if (handle.includes("n")) {
        const rawY = snapValue(y + dyPct, snapStep);
        const clampedY = Math.max(0, Math.min(bottom - MIN_ELEMENT_HEIGHT_PCT, rawY));
        h = bottom - clampedY;
        y = clampedY;
      }

      return clampElementBounds({ ...el, x, y, w, h });
    }

    function bringForward(elements, id) {
      const maxZ = elements.reduce((m, e) => Math.max(m, e.zIndex), 1);
      return elements.map((el) => (el.id === id ? { ...el, zIndex: maxZ + 1 } : el));
    }

    function sendBackward(elements, id) {
      const minZ = elements.reduce((m, e) => Math.min(m, e.zIndex), 1);
      const nextZ = Math.max(1, minZ - 1);
      return elements.map((el) => {
        if (el.id === id) return { ...el, zIndex: 1 };
        return { ...el, zIndex: el.zIndex >= nextZ ? el.zIndex + 1 : el.zIndex };
      });
    }

    function hasElementContent(el, milestones) {
      if (el.type === "milestones") {
        return Boolean(milestones && milestones.length > 0);
      }
      if (el.type === "stat") {
        return Boolean((el.content || "").trim() || (el.subContent || "").trim());
      }
      if (el.type === "skills") {
        return Boolean((el.content || "").trim() || (el.subContent || "").trim());
      }
      return Boolean((el.content || "").trim());
    }

    function cloneLayoutToDevice(source, targetDevice) {
      if (targetDevice === "desktop") {
        return {
          canvasHeight: source.canvasHeight,
          canvasWidthPct: source.canvasWidthPct ?? 100,
          elements: source.elements.map((e) => ({ ...e })),
        };
      }
      if (targetDevice === "tablet") {
        return {
          canvasHeight: Math.max(420, source.canvasHeight),
          canvasWidthPct: 100,
          elements: source.elements.map((e) =>
            clampElementBounds({
              ...e,
              fontSize: Math.max(12, Math.round(e.fontSize * 0.92)),
            })
          ),
        };
      }
      const sorted = [...source.elements].sort((a, b) => a.y - b.y || a.x - b.x);
      let cursorY = 3;
      const stepH = Math.floor(90 / Math.max(1, sorted.length));
      return {
        canvasHeight: Math.max(460, sorted.length * 145),
        canvasWidthPct: 100,
        elements: sorted.map((el, idx) => {
          const h = el.type === "image" ? Math.max(20, stepH) : Math.max(11, stepH - 2);
          const mapped = clampElementBounds({
            ...el,
            x: 4,
            y: Math.min(90, cursorY),
            w: 92,
            h: Math.min(34, h),
            fontSize: Math.max(12, Math.min(24, Math.round(el.fontSize * 0.82))),
            zIndex: idx + 1,
          });
          cursorY += mapped.h + 3;
          return mapped;
        }),
      };
    }

        );

    // ==================== FREEFORM PROFILE CANVAS COMPONENT ====================

    function getElementSurfaceClass(surface, isDark) {
      if (surface === "transparent") return "bg-transparent border-transparent";
      if (surface === "elevated") {
        return isDark
          ? "bg-zinc-900 border border-white/15 shadow-lg"
          : "bg-white border border-zinc-200 shadow-md";
      }
      if (surface === "accent") {
        return isDark
          ? "bg-white text-black border border-white"
          : "bg-zinc-950 text-white border border-zinc-950";
      }
      return isDark
        ? "bg-zinc-950/90 border border-white/10"
        : "bg-white border border-zinc-200";
    }

    function FreeformProfileCanvas({
      isDark,
      profile,
      isAdmin,
      onEditProfile,
      onOpenDesigner,
    }) {
      const [detectedDevice, setDetectedDevice] = useState(() =>
        typeof window !== "undefined"
          ? getPublicDefaultDeviceFromWidth(window.innerWidth)
          : "desktop"
      );
      const [previewOverride, setPreviewOverride] = useState(null);

      useEffect(() => {
        const handleResize = () => {
          setDetectedDevice(getPublicDefaultDeviceFromWidth(window.innerWidth));
        };
        window.addEventListener("resize", handleResize);
        return () => window.removeEventListener("resize", handleResize);
      }, []);

      const layouts = profile.canvasLayouts || createDefaultCanvasLayouts(profile);
      const activeDevice = previewOverride || detectedDevice;
      const activeLayout = layouts[activeDevice] || layouts.desktop;
      const visibleElements = [...(activeLayout.elements || [])]
        .filter((el) => el.visible && hasElementContent(el, profile.milestones))
        .sort((a, b) => a.zIndex - b.zIndex);

            {visibleElements.length > 0 ? (

            {hasMilestones && (

    }

    // ==================== CANVAS DESIGNER STUDIO MODAL ====================
    const RESIZE_HANDLES = [
      { handle: "nw", className: "-top-1.5 -left-1.5 cursor-nwse-resize" },
      { handle: "n", className: "-top-1.5 left-1/2 -translate-x-1/2 cursor-ns-resize" },
      { handle: "ne", className: "-top-1.5 -right-1.5 cursor-nesw-resize" },
      { handle: "e", className: "top-1/2 -right-1.5 -translate-y-1/2 cursor-ew-resize" },
      { handle: "se", className: "-bottom-1.5 -right-1.5 cursor-nwse-resize" },
      { handle: "s", className: "-bottom-1.5 left-1/2 -translate-x-1/2 cursor-ns-resize" },
      { handle: "sw", className: "-bottom-1.5 -left-1.5 cursor-nesw-resize" },
      { handle: "w", className: "top-1/2 -left-1.5 -translate-y-1/2 cursor-ew-resize" },
    ];

    function CanvasDesignerModal({ isDark, profile, onClose, onSave, onError }) {
      const [layouts, setLayouts] = useState(() => {
        const base = profile.canvasLayouts || createDefaultCanvasLayouts(profile);
        return JSON.parse(JSON.stringify(base));
      });
      const [activeDevice, setActiveDevice] = useState("desktop");
      const [selectedId, setSelectedId] = useState(
        () => layouts.desktop.elements[0]?.id || null
      );
      const [snapEnabled, setSnapEnabled] = useState(false);
      const [showGrid, setShowGrid] = useState(true);
      const [saving, setSaving] = useState(false);

      const canvasRef = useRef(null);
      const imageInputRef = useRef(null);
      const interactionRef = useRef(null);

      const currentLayout = layouts[activeDevice];
      const selectedEl = currentLayout.elements.find((e) => e.id === selectedId) || null;

      useEffect(() => {
        const first = layouts[activeDevice].elements[0]?.id || null;
        setSelectedId((prev) =>
          layouts[activeDevice].elements.some((e) => e.id === prev) ? prev : first
        );
      }, [activeDevice, layouts]);

      useEffect(() => {
        const handlePointerMove = (ev) => {
          const active = interactionRef.current;
          if (!active) return;

          if (active.mode === "canvas-height") {
            const nextH = Math.max(
              220,
              Math.min(
                1600,
                Math.round((active.startCanvasHeight || 540) + (ev.clientY - active.startClientY))
              )
            );
            setLayouts((prev) => ({
              ...prev,
              [activeDevice]: {
                ...prev[activeDevice],
                canvasHeight: nextH,
              },
            }));
            return;
          }

          const canvasEl = canvasRef.current;
          if (!canvasEl || !active.elementId || !active.startEl) return;

          const rect = canvasEl.getBoundingClientRect();
          if (!rect.width || !rect.height) return;

          const dxPct = ((ev.clientX - active.startClientX) / rect.width) * 100;
          const dyPct = ((ev.clientY - active.startClientY) / rect.height) * 100;
          const step = snapEnabled ? 1 : 0;

          const updated =
            active.mode === "drag"
              ? applyDragDelta(active.startEl, dxPct, dyPct, step)
              : applyResizeDelta(
                  active.startEl,
                  active.handle || "se",
                  dxPct,
                  dyPct,
                  step
                );

          setLayouts((prev) => ({
            ...prev,
            [activeDevice]: {
              ...prev[activeDevice],
              elements: prev[activeDevice].elements.map((item) =>
                item.id === active.elementId ? updated : item
              ),
            },
          }));
        };

        const handlePointerUp = () => {
          if (interactionRef.current) {
            playSound("snap");
            interactionRef.current = null;
          }
        };

        window.addEventListener("pointermove", handlePointerMove);
        window.addEventListener("pointerup", handlePointerUp);
        return () => {
          window.removeEventListener("pointermove", handlePointerMove);
          window.removeEventListener("pointerup", handlePointerUp);
        };
      }, [activeDevice, snapEnabled]);

      const updateSelected = (patch) => {
        if (!selectedId) return;
        setLayouts((prev) => ({
          ...prev,
          [activeDevice]: {
            ...prev[activeDevice],
            elements: prev[activeDevice].elements.map((item) =>
              item.id === selectedId ? clampElementBounds({ ...item, ...patch }) : item
            ),
          },
        }));
      };

      const addNewElement = (type) => {
        playSound("click");
        const id = `el-${Date.now()}`;
        const maxZ = currentLayout.elements.reduce((m, e) => Math.max(m, e.zIndex), 1);
        const defaults = {
          heading: {
            label: "หัวข้อใหม่",
            content: "หัวข้อข้อมูลส่วนตัว",
            w: 44,
            h: 12,
            fontSize: 26,
            fontWeight: "700",
            surface: "transparent",
          },
          text: {
            label: "กล่องข้อความใหม่",
            content: "พิมพ์ข้อความแนะนำตัวหรือรายละเอียดเพิ่มเติมที่นี่",
            w: 46,
            h: 18,
            fontSize: 15,
            fontWeight: "400",
            surface: "card",
          },
          image: {
            label: "รูปภาพใหม่",
            content: BRAND_LOGO_URL,
            w: 24,
            h: 34,
            fontSize: 14,
            fontWeight: "400",
            surface: "card",
            imageFit: "cover",
          },
          stat: {
            label: "กล่องข้อมูลสรุป",
            content: "100 คะแนน",
            subContent: "คำอธิบายประกอบ",
            w: 28,
            h: 18,
            fontSize: 22,
            fontWeight: "600",
            surface: "card",
          },
          skills: {
            label: "รายการทักษะ",
            content: "React, TypeScript, Firebase, การออกแบบระบบ",
            subContent: "ขอบเขตความเชี่ยวชาญ",
            w: 45,
            h: 20,
            fontSize: 13,
            fontWeight: "500",
            surface: "card",
          },
          milestones: {
            label: "ไทม์ไลน์ชีวิต",
            content: "ลำดับเหตุการณ์สำคัญ",
            w: 45,
            h: 26,
            fontSize: 13,
            fontWeight: "400",
            surface: "card",
          },
          card: {
            label: "กรอบข้อมูลเฉพาะเรื่อง",
            subContent: "หัวข้อย่อย",
            content: "รายละเอียดข้อมูลเพิ่มเติมสำหรับจัดวางบนผัง",
            w: 42,
            h: 20,
            fontSize: 14,
            fontWeight: "400",
            surface: "elevated",
          },
        };

        const spec = defaults[type] || defaults.text;
        const newEl = clampElementBounds({
          id,
          type,
          label: spec.label || "องค์ประกอบใหม่",
          x: 8,
          y: 8,
          w: spec.w || 32,
          h: spec.h || 16,
          zIndex: maxZ + 1,
          visible: true,
          content: spec.content || "",
          subContent: spec.subContent || "",
          fontSize: spec.fontSize || 14,
          fontWeight: spec.fontWeight || "400",
          textAlign: "left",
          surface: spec.surface || "card",
          radius: 16,
          imageFit: spec.imageFit || "cover",
        });

        setLayouts((prev) => ({
          ...prev,
          [activeDevice]: {
            ...prev[activeDevice],
            elements: [...prev[activeDevice].elements, newEl],
          },
        }));
        setSelectedId(id);
      };

      const duplicateSelected = () => {
        if (!selectedEl) return;
        playSound("click");
        const id = `el-${Date.now()}`;
        const maxZ = currentLayout.elements.reduce((m, e) => Math.max(m, e.zIndex), 1);
        const copy = clampElementBounds({
          ...selectedEl,
          id,
          label: `${selectedEl.label} สำเนา`,
          x: selectedEl.x + 3,
          y: selectedEl.y + 3,
          zIndex: maxZ + 1,
        });
        setLayouts((prev) => ({
          ...prev,
          [activeDevice]: {
            ...prev[activeDevice],
            elements: [...prev[activeDevice].elements, copy],
          },
        }));
        setSelectedId(id);
      };

      const deleteSelected = () => {
        if (!selectedId) return;
        playSound("delete");
        setLayouts((prev) => {
          const remaining = prev[activeDevice].elements.filter(
            (e) => e.id !== selectedId
          );
          setSelectedId(remaining[0]?.id || null);
          return {
            ...prev,
            [activeDevice]: {
              ...prev[activeDevice],
              elements: remaining,
            },
          };
        });
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 720);
          playSound("success");
          updateSelected({ content: dataUrl });
        } catch (err) {
          onError(err?.message || "ไม่สามารถอัปโหลดรูปภาพได้");
        }
      };

      const handleCopyFromDesktop = () => {
        playSound("toggle");
        const converted = cloneLayoutToDevice(layouts.desktop, activeDevice);
        setLayouts((prev) => ({
          ...prev,
          [activeDevice]: converted,
        }));
      };

      const handleResetAll = () => {
        playSound("delete");
        const fresh = createDefaultCanvasLayouts(profile);
        setLayouts(fresh);
        setSelectedId(fresh[activeDevice].elements[0]?.id || null);
      };

      const handleSave = async () => {
        setSaving(true);
        try {
          await onSave(layouts);
          playSound("success");
        } finally {
          setSaving(false);
        }
      };

      const canvasMaxWidth =
        activeDevice === "desktop"
          ? "100%"
          : activeDevice === "tablet"
            ? "768px"
            : "390px";

      const inputClass = `w-full rounded-lg border px-3 py-1.5 text-xs focus:outline-none ${
        isDark
          ? "border-white/15 bg-black text-white focus:border-white/50"
          : "border-zinc-300 bg-zinc-50 text-zinc-950 focus:border-zinc-900"
      }`;

      const deviceTabs = [
        { id: "desktop", label: "คอมพิวเตอร์", Icon: IconMonitor },
        { id: "tablet", label: "แท็บเล็ต", Icon: IconTablet },
        { id: "mobile", label: "โทรศัพท์มือถือ", Icon: IconSmartphone },
      ];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-sm">
          <div
            className={`animate-modal w-full max-w-[1400px] h-[94vh] rounded-2xl border flex flex-col overflow-hidden shadow-2xl ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            {/* Top Studio Toolbar */}
            <div
              className={`px-4 sm:px-6 py-3.5 border-b flex flex-wrap items-center justify-between gap-3 ${
                isDark ? "border-white/10 bg-black/60" : "border-zinc-200 bg-zinc-50"
              }`}
            >
              <div>
                <h3 className="text-base sm:text-lg font-semibold">
                  สตูดิโอจัดวางผังข้อมูลส่วนบุคคลแบบอิสระ
                </h3>
                <p className={`text-xs ${isDark ? "text-zinc-400" : "text-zinc-500"}`}>
                  ลากย้ายตำแหน่ง ปรับขนาดจากมุมกรอบ และตั้งค่าแยกอิสระสำหรับคอมพิวเตอร์ แท็บเล็ต และโทรศัพท์มือถือ
                </p>
              </div>

              <div
                className={`inline-flex items-center p-1 rounded-xl border ${
                  isDark ? "border-white/15 bg-zinc-900" : "border-zinc-200 bg-white"
                }`}
              >
                {deviceTabs.map(({ id, label, Icon }) => {
                  const active = activeDevice === id;
                  return (
                    <button
                      key={id}
                      type="button"
                      onClick={() => {
                        playSound("toggle");
                        setActiveDevice(id);
                      }}
                      className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors whitespace-nowrap ${
                        active
                          ? isDark
                            ? "bg-white text-black"
                            : "bg-zinc-950 text-white"
                          : isDark
                            ? "text-zinc-400 hover:text-white"
                            : "text-zinc-600 hover:text-zinc-950"
                      }`}
                    >
                      <Icon size={14} />
                      <span>{label}</span>
                    </button>
                  );
                })}
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => {
                    playSound("toggle");
                    setShowGrid((g) => !g);
                  }}
                  className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border text-xs font-medium ${
                    showGrid
                      ? isDark
                        ? "border-white/30 bg-white/10 text-white"
                        : "border-zinc-900 bg-zinc-100 text-zinc-950"
                      : isDark
                        ? "border-white/15 text-zinc-400"
                        : "border-zinc-200 text-zinc-600"
                  }`}
                >
                  <IconGrid size={14} />
                  <span>เส้นตาราง</span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    playSound("toggle");
                    setSnapEnabled((s) => !s);
                  }}
                  className={`px-3 py-2 rounded-lg border text-xs font-medium ${
                    snapEnabled
                      ? isDark
                        ? "border-white/30 bg-white/10 text-white"
                        : "border-zinc-900 bg-zinc-100 text-zinc-950"
                      : isDark
                        ? "border-white/15 text-zinc-400"
                        : "border-zinc-200 text-zinc-600"
                  }`}
                >
                  จัดแนวอัตโนมัติ
                </button>

                <button
                  type="button"
                  onClick={handleSave}
                  disabled={saving}
                  className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-medium disabled:opacity-50 ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  <IconSave size={14} />
                  <span>{saving ? "กำลังบันทึก..." : "บันทึกผังทั้งหมด"}</span>
                </button>

                <button
                  type="button"
                  onClick={() => {
                    playSound("click");
                    onClose();
                  }}
                  aria-label="ปิดสตูดิโอออกแบบ"
                  className={`w-9 h-9 rounded-lg flex items-center justify-center border ${
                    isDark
                      ? "border-white/15 hover:bg-white/10 text-zinc-300"
                      : "border-zinc-200 hover:bg-zinc-100 text-zinc-600"
                  }`}
                >
                  <IconX size={18} />
                </button>
              </div>

    // ==================== SECTION 2: STORIES / BLOG ====================
    function StorySection({
      isDark,
      stories,
      commentsByStory,
      likedStoryIds,
      isAdmin,

      onAddComment,

      const [selectedCategory, setSelectedCategory] = useState("all");
      const [selectedTag, setSelectedTag] = useState("all");
      const [readingStory, setReadingStory] = useState(null);
      const [formOpen, setFormOpen] = useState(false);
      const [editingStory, setEditingStory] = useState(null);

      const categories = useMemo(
        () => [...new Set(stories.map((s) => s.category).filter(Boolean))],

      const tags = useMemo(() => {

        return [...new Set(allTags)];
      }, [stories]);

      const filtered = useMemo(
        () =>
          filterStories(stories, {

            tag: selectedTag,

        [stories, query, selectedCategory, selectedTag]

      const activeReadingStory = readingStory

      return (
        <section

          className={`border-t transition-colors duration-300 ${

          <div className="max-w-7xl mx-auto px-6 py-20 md:px-12 lg:px-16">
            <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-10">
              <div>
                <div
                  className={`text-xs uppercase tracking-widest mb-2 ${
                    isDark ? "text-zinc-400" : "text-zinc-500"

                </div>
                <h2 className="text-2xl sm:text-4xl font-medium tracking-tight">

                </h2>

                  className={`text-sm sm:text-base mt-2 max-w-2xl leading-relaxed ${
                    isDark ? "text-zinc-400" : "text-zinc-600"

                </p>
              </div>

              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div className="relative">
                  <IconSearch
                    size={16}
                    className={`absolute left-3.5 top-1/2 -translate-y-1/2 ${
                      isDark ? "text-zinc-500" : "text-zinc-400"

                  />
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}

                    className={`w-full sm:w-64 rounded-lg border pl-10 pr-4 py-2.5 text-sm focus:outline-none ${
                      isDark
                        ? "border-white/15 bg-zinc-950 text-white placeholder:text-zinc-500 focus:border-white/40"
                        : "border-zinc-200 bg-zinc-50 text-zinc-950 placeholder:text-zinc-400 focus:border-zinc-900"
                    }`}
                  />
                </div>

                {isAdmin && (
                  <button
                    type="button"
                    onClick={() => {
                      playSound("open");
                      setEditingStory(null);
                      setFormOpen(true);

                    className={`inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-transform hover:scale-[1.02] ${
                      isDark ? "bg-white text-black" : "bg-zinc-950 text-white"

                    <IconPlus size={16} />

                  </button>

            </div>

            {categories.length > 0 && (

                        ? "bg-white text-black border-white"

                      : isDark
                        ? "border-white/15 text-zinc-400 hover:text-white"
                        : "border-zinc-200 text-zinc-600 hover:text-zinc-950"

                      playSound("toggle");

                      selectedCategory === cat

                      setSelectedTag(tag);

                      selectedTag === tag

                          ? "text-zinc-400"
                          : "text-zinc-600"

                    <article
                      key={story.id}
                      className={`rounded-2xl border overflow-hidden flex flex-col transition-all ${
                        isDark
                          ? "border-white/10 bg-zinc-950 hover:border-white/25"
                          : "border-zinc-200 bg-white hover:border-zinc-400 shadow-sm"
                      }`}
                    >
                      {story.coverImage && (
                        <button
                          type="button"
                          onClick={() => {
                            playSound("open");
                            setReadingStory(story);
                            onOpenStory(story);
                          }}
                          className="block text-left w-full overflow-hidden aspect-[16/10] bg-zinc-900"
                        >
                          <img
                            src={story.coverImage}
                            alt={story.title}
                            loading="lazy"
                            referrerPolicy="no-referrer"
                            className="w-full h-full object-cover hover:scale-[1.03] transition-transform duration-300"
                          />
                        </button>
                      )}

                      <div className="p-6 flex flex-col flex-grow">
                        {(story.category || story.createdAt || story.content) && (
                          <div
                            className={`text-xs mb-2.5 flex flex-wrap items-center gap-1.5 ${
                              isDark ? "text-zinc-400" : "text-zinc-500"
                            }`}
                          >
                            {[
                              story.category,
                              story.createdAt ? formatFormalThaiDate(story.createdAt) : "",
                              story.content?.trim() ? `อ่าน ${mins} นาที` : "",
                            ]
                              .filter(Boolean)
                              .map((part, idx, arr) => (
                                <React.Fragment key={idx}>
                                  <span>{part}</span>
                                  {idx < arr.length - 1 && <span aria-hidden="true">·</span>}
                                </React.Fragment>
                              ))}
                          </div>
                        )}

                        {story.title && (
                          <button
                            type="button"
                            onClick={() => {
                              playSound("open");
                              setReadingStory(story);
                              onOpenStory(story);
                            }}
                            className="text-left"
                          >
                            <h3 className="text-lg font-medium tracking-tight leading-snug mb-2.5 hover:underline">
                              {story.title}
                            </h3>
                          </button>
                        )}

                        {story.content && (
                          <p
                            className={`text-sm leading-relaxed line-clamp-3 mb-4 flex-grow ${
                              isDark ? "text-zinc-400" : "text-zinc-600"
                            }`}
                          >
                            {story.content}
                          </p>

                        {(story.tags || []).length > 0 && (
                          <div
                            className={`text-xs mb-4 truncate ${
                              isDark ? "text-zinc-500" : "text-zinc-400"

                          >
                            {(story.tags || []).join(" · ")}

                        <div
                          className={`pt-4 border-t flex items-center justify-between gap-2 ${
                            isDark ? "border-white/10" : "border-zinc-200"

                          <div className="flex items-center gap-3 text-xs">
                            <button
                              type="button"
                              onClick={() => {
                                playSound("toggle");
                                onLikeStory(story);
                              }}
                              className={`inline-flex items-center gap-1.5 py-1 px-2 rounded-md transition-colors ${
                                isLiked
                                  ? "text-rose-500 font-medium"
                                  : isDark
                                    ? "text-zinc-400 hover:text-white"
                                    : "text-zinc-600 hover:text-zinc-950"
                              }`}
                            >
                              <IconHeart size={14} filled={isLiked} />
                              <span className="font-mono-tabular">{story.likes}</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => {
                                playSound("open");
                                setReadingStory(story);
                                onOpenStory(story);
                              }}
                              className={`inline-flex items-center gap-1.5 py-1 px-2 rounded-md ${
                                isDark
                                  ? "text-zinc-400 hover:text-white"
                                  : "text-zinc-600 hover:text-zinc-950"
                              }`}
                            >
                              <IconMessageSquare size={14} />
                              <span className="font-mono-tabular">{commentCount}</span>
                            </button>

                            <span
                              className={`font-mono-tabular ${
                                isDark ? "text-zinc-500" : "text-zinc-400"
                              }`}
                            >
                              เข้าชม {story.views}
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() => {
                                playSound("click");
                                onShareStory(story);
                              }}
                              aria-label={`คัดลอกลิงก์บทความ ${story.title}`}
                              className={`p-1.5 rounded-lg border text-xs ${
                                isDark
                                  ? "border-white/15 text-zinc-300 hover:bg-white/10"
                                  : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                              }`}
                            >
                              <IconShare2 size={13} />
                            </button>

                            {isAdmin && !story.isLocalSeed && (
                              <>
                                <button
                                  type="button"
                                  onClick={() => {
                                    playSound("open");
                                    setEditingStory(story);
                                    setFormOpen(true);
                                  }}
                                  aria-label={`แก้ไขบทความ ${story.title}`}
                                  className={`p-1.5 rounded-lg border text-xs ${
                                    isDark
                                      ? "border-white/15 text-zinc-300 hover:bg-white/10"
                                      : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                                  }`}
                                >
                                  <IconPencil size={13} />
                                </button>
                                <button
                                  type="button"
                                  onClick={() => {
                                    playSound("delete");
                                    onDeleteStory(story);
                                  }}
                                  aria-label={`ลบบทความ ${story.title}`}
                                  className="p-1.5 rounded-lg border border-rose-500/30 text-rose-500 hover:bg-rose-500/15"
                                >
                                  <IconTrash size={13} />
                                </button>
                              </>
                            )}
                          </div>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </div>
            )}
          </div>

          {activeReadingStory && (
            <StoryReaderModal
              isDark={isDark}
              story={activeReadingStory}
              comments={commentsByStory[activeReadingStory.id] || []}
              isLiked={likedStoryIds.includes(activeReadingStory.id)}
              onClose={() => {
                playSound("click");
                setReadingStory(null);
              }}
              onLike={() => {
                playSound("toggle");
                onLikeStory(activeReadingStory);
              }}
              onShare={() => {
                playSound("click");
                onShareStory(activeReadingStory);
              }}
              onAddComment={onAddComment}
            />
          )}

          {formOpen && (
            <StoryFormModal
              isDark={isDark}
              editingStory={editingStory}
              onClose={() => {
                playSound("click");
                setFormOpen(false);
                setEditingStory(null);
              }}
              onSave={async (payload, editId) => {
                const ok = await onSaveStory(payload, editId);
                if (ok) {
                  setFormOpen(false);
                  setEditingStory(null);
                }
                return ok;
              }}
              onError={onError}
            />
          )}
        </section>
      );
    }

    function StoryReaderModal({
      isDark,
      story,
      comments,
      isLiked,
      onClose,
      onLike,
      onShare,
      onAddComment,
    }) {
      const [author, setAuthor] = useState("");
      const [message, setMessage] = useState("");
      const [submitting, setSubmitting] = useState(false);

      const mins = estimateReadingMinutes(story.content);

      const handleCommentSubmit = async (e) => {
        e.preventDefault();
        if (!author.trim() && !message.trim()) return;
        setSubmitting(true);
        try {
          await onAddComment(
            story.id,
            author.trim() || "ผู้เยี่ยมชม",
            message.trim()
          );
          playSound("success");
          setMessage("");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div
            className={`animate-modal w-full max-w-3xl rounded-2xl border shadow-2xl my-6 max-h-[92vh] overflow-y-auto ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            <div
              className={`sticky top-0 z-10 px-6 py-4 border-b flex items-center justify-between backdrop-blur-md ${
                isDark
                  ? "border-white/10 bg-zinc-950/90"
                  : "border-zinc-200 bg-white/90"
              }`}
            >
              <div
                className={`text-xs flex flex-wrap items-center gap-1.5 ${
                  isDark ? "text-zinc-400" : "text-zinc-500"
                }`}
              >
                {[
                  story.category,
                  story.createdAt ? formatFormalThaiDate(story.createdAt) : "",
                  story.content?.trim() ? `อ่าน ${mins} นาที` : "",
                ]
                  .filter(Boolean)
                  .map((part, idx, arr) => (
                    <React.Fragment key={idx}>
                      <span>{part}</span>
                      {idx < arr.length - 1 && <span aria-hidden="true">·</span>}
                    </React.Fragment>
                  ))}
              </div>
              <button
                type="button"
                onClick={onClose}
                aria-label="ปิดหน้าต่างอ่านบทความ"
                className={`w-9 h-9 rounded-lg flex items-center justify-center ${
                  isDark
                    ? "hover:bg-white/10 text-zinc-300"
                    : "hover:bg-zinc-100 text-zinc-600"
                }`}
              >
                <IconX size={18} />
              </button>
            </div>

            <div className="p-6 sm:p-10 max-w-2xl mx-auto">
              {story.title && (
                <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight leading-snug mb-6">
                  {story.title}
                </h2>
              )}

              {story.coverImage && (
                <img
                  src={story.coverImage}
                  alt={story.title || "ภาพประกอบบทความ"}
                  loading="lazy"
                  referrerPolicy="no-referrer"
                  className="w-full rounded-xl object-cover aspect-[16/9] mb-8 border border-current/10"
                />
              )}

              {story.content && (
                <div
                  className={`text-base sm:text-[17px] leading-[1.85] whitespace-pre-line mb-10 ${
                    isDark ? "text-zinc-200" : "text-zinc-800"
                  }`}
                >
                  {story.content}
                </div>
              )}

              {(story.tags || []).length > 0 && (
                <div
                  className={`text-xs pb-6 mb-6 border-b ${
                    isDark
                      ? "border-white/10 text-zinc-400"
                      : "border-zinc-200 text-zinc-500"
                  }`}
                >
                  คำสำคัญ {(story.tags || []).join(" · ")}
                </div>
              )}

              <div className="flex flex-wrap items-center justify-between gap-4 pb-8 mb-8 border-b border-current/10">
                <div className="flex items-center gap-3">
                  <button
                    type="button"
                    onClick={onLike}

    function StoryFormModal({ isDark, editingStory, onClose, onSave, onError }) {
      const fileRef = useRef(null);
      const [title, setTitle] = useState(editingStory?.title || "");
      const [slug, setSlug] = useState(editingStory?.slug || "");
      const [category, setCategory] = useState(editingStory?.category || "");
      const [tagsText, setTagsText] = useState(
        editingStory ? (editingStory.tags || []).join(", ") : ""
      );
      const [createdAt, setCreatedAt] = useState(editingStory?.createdAt || "");
      const [coverImage, setCoverImage] = useState(editingStory?.coverImage || "");
      const [content, setContent] = useState(editingStory?.content || "");
      const [saving, setSaving] = useState(false);

      const handleCoverUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageFile(file, 720);
          playSound("success");
          setCoverImage(dataUrl);
        } catch (err) {
          onError(err?.message || "ไม่สามารถอัปโหลดรูปหน้าปกได้");
        } finally {
          e.target.value = "";
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!title.trim() && !content.trim() && !coverImage.trim()) {
          onError("กรุณากรอกข้อความหรืออัปโหลดรูปภาพอย่างน้อย 1 รายการ");
          return;
        }
        setSaving(true);
        try {
          const tags = tagsText
            .split(",")
            .map((t) => t.trim())
            .filter(Boolean);
          const computedYear = createdAt ? extractBuddhistYear(createdAt) : "";
          const ok = await onSave(
            {
              title: title.trim(),
              slug: slug.trim() || (title.trim() ? generateSlug(title) : `story-${Date.now()}`),
              category: category.trim(),
              tags,
              createdAt,
              buddhistYear: computedYear,
              coverImage: coverImage.trim(),
              content: content.trim(),
            },
            editingStory?.id
          );
          if (ok) {
            playSound("success");
          }
        } finally {
          setSaving(false);
        }
      };

      const inputClass = `w-full rounded-xl border px-3.5 py-2 text-sm focus:outline-none ${
        isDark
          ? "border-white/15 bg-black text-white focus:border-white/50"
          : "border-zinc-300 bg-zinc-50 text-zinc-950 focus:border-zinc-900"
      }`;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm overflow-y-auto">
          <div
            className={`animate-modal w-full max-w-2xl rounded-2xl border p-6 sm:p-7 shadow-2xl my-8 max-h-[90vh] overflow-y-auto ${
              isDark
                ? "border-white/15 bg-zinc-950 text-white"
                : "border-zinc-200 bg-white text-zinc-950"
            }`}
          >
            <div className="flex items-center justify-between pb-3 mb-4 border-b border-current/10">
              <h3 className="text-lg font-semibold">
                {editingStory ? "แก้ไขบทความและเรื่องเล่า" : "สร้างบทความและเรื่องเล่าใหม่"}
              </h3>
              <button
                type="button"
                onClick={onClose}
                aria-label="ปิดหน้าต่างบทความ"
                className="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-current/10"
              >
                <IconX size={18} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-medium mb-1">ชื่อบทความ</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => {
                    setTitle(e.target.value);
                    if (!editingStory) setSlug(generateSlug(e.target.value));
                  }}
                  placeholder="ระบุหัวข้อเรื่องเล่า"
                  className={inputClass}
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">รหัสลิงก์บทความ</label>
                  <input
                    type="text"
                    value={slug}
                    onChange={(e) => setSlug(e.target.value)}
                    placeholder="story-slug"
                    className={`${inputClass} min-w-0 max-w-full`}
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">หมวดหมู่</label>
                  <input
                    type="text"
                    value={category}
                    onChange={(e) => setCategory(e.target.value)}
                    placeholder="เช่น สถาปัตยกรรมระบบ"
                    className={`${inputClass} min-w-0 max-w-full`}
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">วันที่เผยแพร่</label>
                  <input
                    type="date"
                    value={createdAt}
                    onChange={(e) => setCreatedAt(e.target.value)}
                    className={`${inputClass} min-w-0 max-w-full appearance-none`}
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-xs font-medium mb-1">
                    คำสำคัญ คั่นด้วยเครื่องหมายจุลภาค
                  </label>
                  <input
                    type="text"
                    value={tagsText}
                    onChange={(e) => setTagsText(e.target.value)}
                    placeholder="เช่น การออกแบบเว็บ, ฐานข้อมูล, บันทึกการเรียนรู้"
                    className={`${inputClass} min-w-0 max-w-full`}
                  />
                </div>
              </div>

              <div
                className={`rounded-xl border p-3.5 ${
                  isDark ? "border-white/10 bg-black" : "border-zinc-200 bg-zinc-50"
                }`}
              >
                <label className="block text-xs font-medium mb-2">
                  รูปหน้าปกบทความ บีบอัดอัตโนมัติ
                </label>
                <input
                  ref={fileRef}
                  type="file"
                  accept="image/*"
                  onChange={handleCoverUpload}
                  className="hidden"
                />
                {coverImage && (
                  <img
                    src={coverImage}
                    alt="ตัวอย่างรูปหน้าปกบทความ"
                    className="w-full max-h-48 object-cover rounded-lg border border-current/15 mb-3"
                  />
                )}
                <div className="flex flex-wrap items-center gap-2 mb-2">
                  <button
                    type="button"
                    onClick={() => {
                      playSound("click");
                      fileRef.current?.click();
                    }}
                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium ${
                      isDark
                        ? "border-white/20 bg-white/10 text-white"
                        : "border-zinc-300 bg-white text-zinc-900"
                    }`}
                  >
                    <IconUpload size={13} />
                    <span>อัปโหลดภาพจากเครื่อง</span>
                  </button>
                  {coverImage && (
                    <button
                      type="button"
                      onClick={() => setCoverImage("")}
                      className="text-xs text-rose-500 hover:underline"
                    >
                      ลบรูปภาพ
                    </button>
                  )}
                </div>
                <input
                  type="text"
                  value={coverImage}
                  onChange={(e) => setCoverImage(e.target.value)}
                  placeholder="หรือวางลิงก์รูปภาพหน้าปก"
                  className={inputClass}
                />
              </div>

              <div>
                <label className="block text-xs font-medium mb-1">เนื้อหาบทความ</label>
                <textarea
                  rows={8}
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  placeholder="เขียนเนื้อหาเรื่องเล่าหรือบันทึกความคิดอย่างละเอียด"
                  className={inputClass}
                />
              </div>

              <div className="flex items-center justify-end gap-2.5 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-4 py-2 rounded-xl text-sm font-medium border ${
                    isDark
                      ? "border-white/15 text-zinc-300 hover:bg-white/10"
                      : "border-zinc-200 text-zinc-700 hover:bg-zinc-100"
                  }`}
                >
                  ยกเลิก
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className={`px-5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 ${
                    isDark ? "bg-white text-black" : "bg-zinc-950 text-white"
                  }`}
                >
                  {saving ? "กำลังบันทึก..." : "เผยแพร่บทความ"}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== SECTION 3: ACTIVITIES & EVENTS TIMELINE ====================
    function ActivitySection({
      isDark,
      activities,
      isAdmin,
      onSaveActivity,
      onDeleteActivity,
      onError,
    }) {

      const [selectedCategory, setSelectedCategory] = useState("all");
      const [selectedYear, setSelectedYear] = useState("all");
      const [viewMode, setViewMode] = useState("timeline");
      const [formOpen, setFormOpen] = useState(false);
      const [editingActivity, setEditingActivity] = useState(null);

      const categories = useMemo(
        () => [...new Set(activities.map((a) => a.category).filter(Boolean))],
        [activities]
      );

      const years = useMemo(
        () =>
          [...new Set(activities.map((a) => a.buddhistYear).filter(Boolean))].sort(
            (a, b) => Number(b) - Number(a)
          ),
        [activities]
      );

      const filtered = useMemo(
        () =>
          filterActivities(activities, {
            query,
            category: selectedCategory,
            year: selectedYear,

        [activities, query, selectedCategory, selectedYear]

            <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-10">

                <div

                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="relative flex-grow sm:flex-grow-0">

                      isDark ? "text-zinc-500" : "text-zinc-400"

                          : "bg-zinc-950 text-white"

                          ? "text-zinc-400"
                          : "text-zinc-600"

                            className={`text-xs flex items-center gap-1.5 ${
                              isDark ? "text-zinc-400" : "text-zinc-600"
                            }`}

                            <IconCalendar size={13} />
                            <span>{formatFormalThaiDate(act.eventDate)}</span>
                          </div>

                        {act.location && (
                          <div
                            className={`text-xs flex items-center gap-1.5 ${
                              isDark ? "text-zinc-400" : "text-zinc-600"
                            }`}
                          >
                            <IconMapPin size={13} />
                            <span>{act.location}</span>
                          </div>
                        )}
                        {(act.category || act.isFeatured) && (
                          <div
                            className={`text-xs pt-1 ${
                              isDark ? "text-zinc-400" : "text-zinc-500"
                            }`}
                          >
